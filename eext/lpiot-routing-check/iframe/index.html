<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>布线检查助手</title>
<style>
:root {
	--bg: #0d1117; --panel: #141a22; --panel2: #1a222c; --line: #263040; --ink: #e6edf3; --dim: #8b98a8; --faint: #5b6778;
	--accent: #39d0b0; --top: #e8683f; --bot: #3f8fe8; --inner: #a07be8; --pad: #d9b44a; --via: #c9ced6;
	--p0: #ff3b5c; --p1: #ff8a3d; --p2: #f5c542; --p3: #6fb7ff; --ok: #3ccf7a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
button { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; transition: border-color .15s, background .15s; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #062019; border-color: var(--accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%; }
textarea { resize: vertical; }
#app { display: grid; grid-template-rows: 56px 1fr; height: 100%; }
header { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #121922, #0f141b); }
.ring { position: relative; width: 42px; height: 42px; }
.ring svg { transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; }
.title { display: flex; flex-direction: column; line-height: 1.25; }
.title span { color: var(--dim); font-size: 12px; }
header .sp { flex: 1; }
header .tools { display: flex; gap: 8px; align-items: center; }
main { display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; background: radial-gradient(ellipse at 50% 40%, #121a24 0%, #0b0f15 70%); }
canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; left: 12px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 24px); }
.chip { padding: 3px 9px; border-radius: 999px; background: rgba(20,26,34,.85); border: 1px solid var(--line); font-size: 12px; color: var(--dim); cursor: pointer; user-select: none; }
.chip.on { color: var(--ink); border-color: var(--accent); }
.chip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.caption { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 7px 14px; border-radius: 8px; background: rgba(13,17,23,.88); border: 1px solid var(--line); font-size: 13px; max-width: 80%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; }
.caption.show { opacity: 1; }
.legend { position: absolute; right: 12px; bottom: 12px; font-size: 11px; color: var(--faint); text-align: right; pointer-events: none; }
aside { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: 40px 1fr; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--dim); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.pane { overflow: auto; padding: 12px; display: none; }
.pane.on { display: block; }
.empty { color: var(--faint); padding: 24px 6px; text-align: center; }
.group { margin-bottom: 12px; }
.group h4 { margin: 0 0 6px; font-size: 12px; color: var(--dim); font-weight: 600; display: flex; justify-content: space-between; }
.item { padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid transparent; margin-bottom: 6px; cursor: pointer; }
.item:hover, .item.sel { border-color: var(--accent); }
.item .row { display: flex; gap: 6px; align-items: baseline; }
.sev { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; color: #0b0f15; }
.sev.P0 { background: var(--p0); } .sev.P1 { background: var(--p1); } .sev.P2 { background: var(--p2); } .sev.P3 { background: var(--p3); }
.rule { color: var(--dim); font-size: 12px; }
.msg { margin-top: 3px; }
.act { margin-top: 6px; display: flex; gap: 6px; }
.act button { padding: 2px 8px; font-size: 12px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.metric { margin-bottom: 10px; }
.metric .row { display: flex; justify-content: space-between; }
.metric .row span:last-child { color: var(--dim); }
.tier { margin-bottom: 10px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--panel2); border-radius: 0 8px 8px 0; }
.tier b { display: block; }
.tier small { color: var(--dim); }
.nets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.nets span { font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); cursor: pointer; }
.nets span:hover { border-color: var(--accent); }
.ai-out { white-space: pre-wrap; background: var(--panel2); border-radius: 8px; padding: 10px; margin-top: 10px; min-height: 60px; }
.form label { display: block; margin: 8px 0 3px; color: var(--dim); font-size: 12px; }
.note { color: var(--faint); font-size: 12px; margin-top: 8px; }
.kbd { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--dim); }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.demo { color: var(--p2); font-size: 12px; }
</style>
</head>
<body>
<div id="app">
	<header>
		<div class="ring"><svg width="42" height="42"><circle cx="21" cy="21" r="18" stroke="#263040" stroke-width="4" fill="none"/><circle id="ringArc" cx="21" cy="21" r="18" stroke="#39d0b0" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="113.1"/></svg><b id="score">—</b></div>
		<div class="title"><strong>布线检查助手</strong><span id="grade">点“检查”读取当前 PCB</span></div>
		<span id="demoTag" class="demo"></span>
		<div class="sp"></div>
		<div class="tools">
			<button id="btnCheck" class="primary">检查</button>
			<button id="btnOrder" title="按优先级回放布线顺序">顺序回放</button>
			<button id="btnFix" title="计算修复方案并预览">修复预览</button>
			<button id="btnApply" disabled>应用修复</button>
			<button id="btnAi">AI 解读</button>
		</div>
	</header>
	<main>
		<div id="stage">
			<canvas id="cv"></canvas>
			<div class="hud" id="hud"></div>
			<div class="caption" id="caption"></div>
			<div class="legend">滚轮缩放 · 拖动平移 · 双击复位 · 点走线看电流</div>
		</div>
		<aside>
			<div class="tabs" id="tabs">
				<button data-t="issues" class="on">结论</button>
				<button data-t="metrics">指标</button>
				<button data-t="order">布线顺序</button>
				<button data-t="fix">修复</button>
				<button data-t="ai">AI</button>
			</div>
			<div class="pane on" id="p-issues"><div class="empty">还没有检查结果</div></div>
			<div class="pane" id="p-metrics"><div class="empty">还没有检查结果</div></div>
			<div class="pane" id="p-order"><div class="empty">还没有检查结果</div></div>
			<div class="pane" id="p-fix"><div class="empty">点“修复预览”计算修复方案。只修几何（任意角度、锐角、抖动、斜出焊盘、悬空线头、重叠线段），不改过孔和连接关系。</div></div>
			<div class="pane" id="p-ai">
				<div class="form">
					<label>补充说明（可选：产品用途、关心的指标、已知约束）</label>
					<textarea id="aiNote" rows="3" placeholder="例如：2 层板，BLE + 纽扣电池，最关心射频和睡眠电流"></textarea>
					<div class="act"><button id="aiGo" class="primary">让 AI 解读整板</button></div>
					<div class="ai-out" id="aiOut">AI 会读取检查报告、网络类和布线顺序，给出先改什么、为什么、怎么改。单条违规可以在“结论”里点“问 AI”。</div>
					<details style="margin-top:14px">
						<summary>AI 设置</summary>
						<label>接口类型</label>
						<select id="aiProvider"><option value="anthropic">Anthropic Claude</option><option value="openai">OpenAI 兼容（DeepSeek、通义、Kimi、本地 Ollama 等）</option></select>
						<label>接口地址</label><input id="aiEndpoint" />
						<label>模型</label><input id="aiModel" />
						<label>API Key（只保存在本机扩展配置里）</label><input id="aiKey" type="password" autocomplete="off" />
						<div class="act"><button id="aiSave">保存</button></div>
						<div class="note">调用模型需要在“扩展管理”里开启本扩展的“外部交互”权限。检查报告会发给你配置的模型服务，请确认符合你的保密要求。</div>
					</details>
				</div>
			</div>
		</aside>
	</main>
</div>
