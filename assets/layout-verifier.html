<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布局布线验证器</title>
<style>
:root {
  --bg: #0b0c10; --panel: #13151b; --panel-2: #191c24; --line: #262a35; --text: #e6e8ee; --muted: #8c93a3;
  --accent: #ffd166; --p0: #ff4d4f; --p1: #ff9f43; --p2: #ffd166; --p3: #8ecae6; --ok: #7ee787;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 13px; }
button, select, input { font: inherit; color: inherit; }
#top { height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 14px; border-bottom: 1px solid var(--line); background: #0e0f14; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
.brand #proj-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { width: 18px; height: 18px; border-radius: 5px; background: conic-gradient(from 200deg, #ffb347, #ff5f6d, #7f7fd5, #86e3ce, #ffb347); flex: none; }
.badge { padding: 2px 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); white-space: nowrap; }
.badge.p { color: #ffd9a0; border-color: #6b5320; background: #2a2110; }
.badge.r { color: #b9f6ca; border-color: #1f6b3a; background: #0f2418; }
#tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
#tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; color: var(--muted); }
#tabs button[aria-selected="true"] { background: #262b38; color: var(--text); }
.actions { display: flex; gap: 6px; flex: 1 1 auto; justify-content: flex-end; }
.tbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.tbtn:hover { border-color: #3a4152; }
.tbtn.on, .tbtn[aria-pressed="true"] { border-color: #6b5320; color: #ffd9a0; }
.tbtn.primary { background: #2b2412; border-color: #6b5320; color: #ffe3a1; }
#layout { display: grid; grid-template-columns: 260px 1fr 330px; height: calc(100% - 52px); }
#left, #right { overflow: auto; padding: 12px 14px 24px; background: var(--panel); }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); }
#stage { position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #12141b 0%, #08090c 75%); }
#stage-canvas { position: absolute; inset: 0 0 34px 0; }
#stage-canvas canvas { position: absolute; inset: 0; }
.cv-top { cursor: grab; touch-action: none; }
.assume-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; margin: 0; padding: 8px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: #0d0e13; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h3 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 16px 0 8px; }
h3:first-child { margin-top: 2px; }
h4 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); }
.muted { color: var(--muted); font-size: 12px; line-height: 1.5; }
.list { display: flex; flex-direction: column; gap: 4px; }
.item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 8px; text-align: left; padding: 7px 9px; border-radius: 8px; border: 1px solid transparent; background: var(--panel-2); cursor: pointer; }
.item.static { cursor: default; }
.item b { font-weight: 600; }
.item span { color: var(--muted); font-size: 12px; }
.item em { font-style: normal; font-size: 11px; color: #c9a86a; }
.item em.warn { color: var(--p1); }
.item .mini { grid-column: 1 / -1; background: #0f1116; border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; font-size: 12px; }
.item.sel { border-color: #6b5320; background: #221d12; }
.item:not(.static):hover { border-color: #3a4152; }
.grade { justify-self: end; padding: 0 6px; border-radius: 99px; font-size: 11px; }
.grade.high { background: #3a1414; color: #ff9a9a; } .grade.mid { background: #3a2c10; color: #ffd27a; } .grade.low { background: #12301d; color: #9be9b0; }
.chk { display: flex; gap: 8px; align-items: center; padding: 4px 0; cursor: pointer; }
.field { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.field span { color: var(--muted); font-size: 12px; }
.field select, .field input { background: #0f1116; border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; }
.seg { display: flex; background: #0f1116; border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 5px 0; border-radius: 6px; cursor: pointer; color: var(--muted); }
.seg button[aria-selected="true"] { background: #262b38; color: var(--text); }
.legend { margin-top: 18px; }
.legend-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.legend-bar { width: 100%; height: 8px; border-radius: 4px; display: block; }
.legend-range { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; margin: 0; }
.kv dt { color: var(--muted); white-space: nowrap; }
.kv dd { margin: 0; line-height: 1.45; }
.findings { margin-top: 12px; }
.card { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 9px 10px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--p3); cursor: pointer; line-height: 1.45; }
.card.sev-P0 { border-left-color: var(--p0); } .card.sev-P1 { border-left-color: var(--p1); } .card.sev-P2 { border-left-color: var(--p2); }
.card.err { border-left-color: var(--p0); cursor: default; }
.card-h { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 11px; color: var(--muted); }
.sev { font-weight: 700; padding: 0 5px; border-radius: 4px; background: #2a2f3c; color: var(--text); }
.sev-P0 .sev { background: #4a1416; } .sev-P1 .sev { background: #4a2a10; } .sev-P2 .sev { background: #3d3412; }
.card .title { font-weight: 500; }
.card .advice { margin-top: 4px; color: #cfd5e2; font-size: 12px; }
.card .assume { margin-top: 3px; color: var(--muted); font-size: 11px; }
.ok { color: var(--ok); }
#tip { position: absolute; pointer-events: none; background: rgba(12,13,18,.92); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-size: 12px; white-space: nowrap; z-index: 5; }
#busy { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: rgba(12,13,18,.9); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; z-index: 6; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #555; border-top-color: var(--accent); animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
#toasts { position: absolute; right: 14px; bottom: 46px; display: flex; flex-direction: column; gap: 6px; z-index: 7; }
.toast { background: rgba(20,22,30,.95); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; max-width: 360px; }
#drop-hint { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; background: rgba(10,10,14,.7); font-size: 18px; z-index: 20; pointer-events: none; }
body.drop #drop-hint { display: flex; }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
@media (max-width: 1000px) {
  #layout { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; height: auto; }
  #left, #right { border: 0; border-top: 1px solid var(--line); }
  #stage { min-height: 60vh; }
  #top { height: auto; flex-wrap: wrap; padding: 8px 12px; }
  .actions { flex-wrap: wrap; }
}

</style>
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span id="proj-name">布局布线验证器</span><span id="stage-badge" class="badge">—</span><span id="calc-mode" class="muted"></span></div>
  <nav id="tabs" role="tablist" aria-label="验证类别">
    <button data-tab="current" role="tab" aria-selected="true">电流与回流</button>
    <button data-tab="emi" role="tab" aria-selected="false">电磁</button>
    <button data-tab="thermal" role="tab" aria-selected="false">温度</button>
  </nav>
  <div class="actions">
    <button id="btn-anim" class="tbtn" aria-pressed="true" title="开关动效">动效</button>
    <button id="btn-perf" class="tbtn" title="减少粒子数，适合较慢的电脑">性能模式</button>
    <button id="btn-open" class="tbtn" title="打开布局 JSON 或铜皮数据包（也可以直接拖进页面）">打开</button>
    <button id="btn-png" class="tbtn" title="导出当前视图">导出 PNG</button>
    <button id="btn-report" class="tbtn primary" title="逐项计算并导出 verify-report.json，交回 Claude 写进评审报告">导出报告</button>
    <input id="file-in" type="file" accept=".json,application/json" multiple hidden>
  </div>
</header>
<main id="layout">
  <aside id="left" aria-label="对象与假如"></aside>
  <section id="stage" aria-label="板图">
    <div id="stage-canvas"></div>
    <div id="tip" role="status" hidden></div>
    <div id="busy" hidden><span class="spin" aria-hidden="true"></span><span id="busy-text">计算中…</span></div>
    <div id="toasts" aria-live="polite"></div>
    <p id="assume" class="assume-bar"></p>
  </section>
  <aside id="right" aria-label="结论"></aside>
</main>
<div id="drop-hint">松开以载入布局 JSON 或铜皮数据包</div>

 * model.js — 项目数据：常量表、校验、默认值、坐标变换、撤销快照、导出。
 * 数据格式见 references/12-layout-planner.md。不依赖 DOM。
 */
(function (LP) {
  'use strict';
  const G = LP.geometry;

  const TOOL_VERSION = '1.0.0';

  /** 主器件角色：label 界面名称；step 所属引导步骤；shape 默认造型；z 默认高度(mm)；edge 默认须贴板边。 */
  const ROLES = {
    soc_rf:        { label: '射频 SoC', step: 5, shape: 'qfn', z: 0.85 },
    mcu:           { label: '主控 MCU', step: 5, shape: 'qfn', z: 0.85 },
    rf_module:     { label: '射频模组', step: 3, shape: 'module', z: 2.2, edge: true },
    antenna:       { label: '天线', step: 3, shape: 'chip_antenna', z: 1.1, edge: true },
    imu:           { label: 'IMU', step: 4, shape: 'lga', z: 0.9 },
    magnetometer:  { label: '磁力计', step: 4, shape: 'lga', z: 0.8 },
    temp_humidity: { label: '温湿度', step: 4, shape: 'dfn', z: 0.8 },
    barometer:     { label: '气压计', step: 4, shape: 'lga', z: 0.9 },
    microphone:    { label: '麦克风', step: 4, shape: 'mic', z: 1.0 },
    optical:       { label: '光学传感器', step: 4, shape: 'optical', z: 1.2 },
    dcdc:          { label: 'DCDC', step: 6, shape: 'dfn', z: 0.8 },
    ldo:           { label: 'LDO', step: 6, shape: 'sot', z: 1.0 },
    charger:       { label: '充电芯片', step: 6, shape: 'dfn', z: 0.8 },
    inductor:      { label: '功率电感', step: 6, shape: 'inductor', z: 1.2 },
    battery:       { label: '电池', step: 2, shape: 'coin', z: 4.0 },
    connector:     { label: '连接器', step: 2, shape: 'usb_c', z: 3.2, edge: true },
    button:        { label: '按键', step: 2, shape: 'button', z: 1.5 },
    led:           { label: 'LED', step: 2, shape: 'led', z: 0.6 },
    flash:         { label: 'Flash', step: 7, shape: 'uson', z: 0.6 },
    motor_driver:  { label: '电机驱动', step: 7, shape: 'dfn', z: 0.8 },
    other:         { label: '其他', step: 7, shape: 'soic', z: 1.4 },
  };

  /** 卫星器件类别：prio 贴放优先级；max 默认最大距离(mm)；sev/check 超限时的级别与清单编号；back 背面代价；avoid 远离对象。 */
  const SAT_KINDS = {
    decoupling:    { label: '去耦电容', prio: 1, max: 2, sev: 'P1', check: 'PI-04', shape: 'cap', back: 1 },
    crystal:       { label: '晶体', prio: 2, max: 4, sev: 'P1', check: 'SI-04', shape: 'crystal', back: 6, avoid: { tags: ['antenna', 'switching', 'inductor'], r: 4 } },
    xtal_load:     { label: '晶体负载电容', prio: 3, max: 2, sev: 'P2', check: 'SI-04', shape: 'cap', back: 6 },
    rf_match:      { label: '射频匹配', prio: 4, max: 1, sev: 'P2', check: 'RF-05', shape: 'cap', back: Infinity },
    dcdc_inductor: { label: 'DCDC 电感', prio: 5, max: 3, sev: 'P1', check: 'PI-01', shape: 'inductor', back: 8, avoid: { tags: ['antenna', 'magnetometer', 'crystal'], r: 8 } },
    dcdc_cap:      { label: 'DCDC 电容', prio: 6, max: 2, sev: 'P1', check: 'PI-01', shape: 'cap', back: 4 },
    series_r:      { label: '串联电阻', prio: 7, max: 3, sev: 'P3', check: 'SI-02', shape: 'res', back: 2 },
    esd:           { label: 'ESD 保护', prio: 8, max: 3, sev: 'P1', check: 'EMC-01', shape: 'esd', back: 4 },
    bulk:          { label: '储能电容', prio: 9, max: 5, sev: 'P2', check: 'PI-06', shape: 'cap', back: 2 },
    pull:          { label: '上下拉', prio: 10, max: 6, sev: 'P3', check: 'SI-05', shape: 'res', back: 1 },
    divider:       { label: '分压电阻', prio: 10, max: 6, sev: 'P3', check: 'SI-05', shape: 'res', back: 1 },
  };

  const NET_CLASSES = {
    rf:          { label: '射频', color: '#22d3ee' },
    power:       { label: '电源', color: '#fb923c' },
    switch_node: { label: '开关节点', color: '#f43f5e' },
    high_speed:  { label: '高速', color: '#a78bfa' },
    analog:      { label: '敏感模拟', color: '#34d399' },
    clock:       { label: '时钟', color: '#facc15' },
    bus:         { label: '总线', color: '#60a5fa' },
    misc:        { label: '普通', color: '#94a3b8' },
  };

  const SIDES = ['N', 'E', 'S', 'W', 'C'];
  const ROTS = [0, 90, 180, 270];
  const SENSOR_ROLES = ['imu', 'magnetometer', 'barometer', 'microphone', 'optical', 'temp_humidity'];

  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
  const isPos = (v) => isNum(v) && v > 0;
  const clone = (o) => JSON.parse(JSON.stringify(o));

  // ---------- 校验 ----------
  /** 校验原始项目数据，返回 [{path, msg}]；空数组表示通过。与 scripts/make_layout_project.py 的规则一致。 */
  function validate(p) {
    const errs = [];
    const err = (path, msg) => errs.push({ path, msg });
    if (!p || typeof p !== 'object' || Array.isArray(p)) { err('', '项目数据必须是 JSON 对象'); return errs; }
    if (p.version !== 1) err('version', '必须为 1');
    if (typeof p.name !== 'string' || !p.name.trim()) err('name', '必须是非空字符串');

    const b = p.board;
    if (!b || typeof b !== 'object') err('board', '缺少 board');
    else {
      const o = b.outline;
      if (!o || typeof o !== 'object') err('board.outline', '缺少板框');
      else if (o.type === 'rect') {
        if (!isPos(o.w)) err('board.outline.w', '必须为正数');
        if (!isPos(o.h)) err('board.outline.h', '必须为正数');
        if (o.corner_r !== undefined && !(isNum(o.corner_r) && o.corner_r >= 0)) err('board.outline.corner_r', '必须为非负数');
      } else if (o.type === 'circle') {
        if (!isPos(o.d)) err('board.outline.d', '必须为正数');
      } else if (o.type === 'polygon') {
        if (!Array.isArray(o.points) || o.points.length < 3) err('board.outline.points', '至少需要 3 个顶点');
        else o.points.forEach((q, i) => { if (!Array.isArray(q) || q.length !== 2 || !isNum(q[0]) || !isNum(q[1])) err(`board.outline.points[${i}]`, '必须是 [x, y]'); });
      } else err('board.outline.type', '必须是 rect、circle 或 polygon');
      if (b.layers !== undefined && ![1, 2, 4, 6, 8].includes(b.layers)) err('board.layers', '必须是 1、2、4、6 或 8');
      for (const k of ['thickness', 'track', 'space', 'via_d']) if (b[k] !== undefined && !isPos(b[k])) err(`board.${k}`, '必须为正数');
      if (b.two_sided !== undefined && typeof b.two_sided !== 'boolean') err('board.two_sided', '必须是 true 或 false');
      (b.holes || []).forEach((h, i) => { if (!isNum(h.x) || !isNum(h.y) || !isPos(h.d)) err(`board.holes[${i}]`, '需要 x、y 和正数 d'); });
      (b.keepouts || []).forEach((k, i) => { if (!isNum(k.x) || !isNum(k.y) || !isPos(k.w) || !isPos(k.h)) err(`board.keepouts[${i}]`, '需要 x、y 和正数 w、h'); });
    }

    const refs = new Set();
    const pinsOf = {};
    if (!Array.isArray(p.parts) || !p.parts.length) err('parts', '至少需要一个主器件');
    else p.parts.forEach((pt, i) => {
      const at = `parts[${i}]`;
      if (typeof pt.ref !== 'string' || !pt.ref) err(`${at}.ref`, '必须是非空字符串');
      else if (refs.has(pt.ref)) err(`${at}.ref`, `位号 ${pt.ref} 重复`);
      else refs.add(pt.ref);
      if (!ROLES[pt.role]) err(`${at}.role`, `未知角色 "${pt.role}"`);
      if (!isPos(pt.w)) err(`${at}.w`, '必须为正数');
      if (!isPos(pt.h)) err(`${at}.h`, '必须为正数');
      if (pt.z !== undefined && !isPos(pt.z)) err(`${at}.z`, '必须为正数');
      if (pt.sides !== undefined && (!Array.isArray(pt.sides) || !pt.sides.length || pt.sides.some((s) => s !== 'top' && s !== 'bottom'))) err(`${at}.sides`, '只能包含 "top" 或 "bottom"');
      const ids = new Set();
      if (!Array.isArray(pt.pins)) err(`${at}.pins`, '必须是数组');
      else pt.pins.forEach((pn, j) => {
        const pa = `${at}.pins[${j}]`;
        if (typeof pn.id !== 'string' || !pn.id) err(`${pa}.id`, '必须是非空字符串');
        else if (ids.has(pn.id)) err(`${pa}.id`, `引脚组 ${pn.id} 重复`);
        else ids.add(pn.id);
        if (!SIDES.includes(pn.side)) err(`${pa}.side`, '必须是 N、E、S、W 或 C');
        if (pn.side !== 'C' && !(isNum(pn.pos) && pn.pos >= 0 && pn.pos <= 1)) err(`${pa}.pos`, '必须在 0 到 1 之间');
        if (pn.count !== undefined && !(Number.isInteger(pn.count) && pn.count >= 1)) err(`${pa}.count`, '必须是正整数');
      });
      if (pt.ref) pinsOf[pt.ref] = ids;
      if (pt.edge_face !== undefined && !['N', 'E', 'S', 'W'].includes(pt.edge_face)) err(`${at}.edge_face`, '必须是 N、E、S 或 W');
      checkPlaced(pt.placed, `${at}.placed`, err);
    });

    const netNames = new Set();
    (p.nets || []).forEach((n, i) => {
      const at = `nets[${i}]`;
      if (typeof n.name !== 'string' || !n.name) err(`${at}.name`, '必须是非空字符串');
      else if (netNames.has(n.name)) err(`${at}.name`, `网络 ${n.name} 重复`);
      else netNames.add(n.name);
      if (!NET_CLASSES[n.class]) err(`${at}.class`, `未知类别 "${n.class}"`);
      if (n.width !== undefined && !(Number.isInteger(n.width) && n.width >= 1)) err(`${at}.width`, '必须是正整数');
      if (n.max_len !== undefined && !isPos(n.max_len)) err(`${at}.max_len`, '必须为正数');
      if (!Array.isArray(n.pins) || n.pins.length < 2) err(`${at}.pins`, '至少连接两个引脚组');
      else n.pins.forEach((q, j) => {
        if (!Array.isArray(q) || q.length !== 2) { err(`${at}.pins[${j}]`, '必须是 [位号, 引脚组]'); return; }
        if (!pinsOf[q[0]]) err(`${at}.pins[${j}]`, `位号 ${q[0]} 不存在`);
        else if (!pinsOf[q[0]].has(q[1])) err(`${at}.pins[${j}]`, `${q[0]} 没有引脚组 ${q[1]}`);
      });
    });

    const satRefs = new Set();
    (p.satellites || []).forEach((s) => { if (typeof s.ref === 'string') satRefs.add(s.ref); });
    const seenSat = new Set();
    (p.satellites || []).forEach((s, i) => {
      const at = `satellites[${i}]`;
      if (typeof s.ref !== 'string' || !s.ref) err(`${at}.ref`, '必须是非空字符串');
      else if (refs.has(s.ref) || seenSat.has(s.ref)) err(`${at}.ref`, `位号 ${s.ref} 重复`);
      else seenSat.add(s.ref);
      if (!SAT_KINDS[s.kind]) err(`${at}.kind`, `未知类别 "${s.kind}"`);
      if (!Array.isArray(s.parent) || s.parent.length !== 2) err(`${at}.parent`, '必须是 [位号, 引脚组]');
      else if (!pinsOf[s.parent[0]]) err(`${at}.parent`, `位号 ${s.parent[0]} 不存在`);
      else if (!pinsOf[s.parent[0]].has(s.parent[1])) err(`${at}.parent`, `${s.parent[0]} 没有引脚组 ${s.parent[1]}`);
      if (!isPos(s.w)) err(`${at}.w`, '必须为正数');
      if (!isPos(s.h)) err(`${at}.h`, '必须为正数');
      if (s.max_dist !== undefined && !isPos(s.max_dist)) err(`${at}.max_dist`, '必须为正数');
      if (s.near !== undefined && (s.near === s.ref || !satRefs.has(s.near))) err(`${at}.near`, `卫星 ${s.near} 不存在`);
      checkPlaced(s.placed, `${at}.placed`, err);
    });

    if (p.rules !== undefined && !Array.isArray(p.rules)) err('rules', '必须是数组');
    else (p.rules || []).forEach((r, i) => { if (!r || (typeof r.id !== 'string' && typeof r.type !== 'string')) err(`rules[${i}]`, '需要 id（覆盖默认规则）或 type（新增规则）'); });
    return errs;
  }
  function checkPlaced(pl, at, err) {
    if (pl === undefined || pl === null) return;
    if (typeof pl !== 'object') { err(at, '必须是对象或 null'); return; }
    if (!isNum(pl.x) || !isNum(pl.y)) err(at, '需要数值 x、y');
    if (pl.rot !== undefined && !ROTS.includes(pl.rot)) err(`${at}.rot`, '必须是 0、90、180 或 270');
    if (pl.side !== undefined && pl.side !== 'top' && pl.side !== 'bottom') err(`${at}.side`, '必须是 "top" 或 "bottom"');
  }

  // ---------- 默认值 ----------
  function normalize(raw) {
    const p = clone(raw);
    const b = p.board;
    b.outline = { corner_r: 0, ...b.outline };
    b.layers = b.layers || 4;
    b.thickness = b.thickness || 1.0;
    b.track = b.track || 0.15;
    b.space = b.space || 0.15;
    b.via_d = b.via_d || 0.45;
    b.two_sided = b.two_sided !== false;
    b.holes = b.holes || [];
    b.keepouts = b.keepouts || [];
    b.mask = b.mask || 'green';
    for (const pt of p.parts) {
      const R = ROLES[pt.role];
      pt.label = pt.label || R.label;
      pt.shape = pt.shape || R.shape;
      pt.z = pt.z || R.z;
      pt.sides = pt.sides || ['top'];
      pt.pins = pt.pins || [];
      for (const pn of pt.pins) { pn.count = pn.count || 1; if (pn.side === 'C') pn.pos = 0.5; }
      pt.locked = !!pt.locked;
      pt.heat_mw = pt.heat_mw || 0;
      if (pt.edge === undefined) pt.edge = !!R.edge || (pt.edge_face !== undefined);
      pt.placed = pt.placed ? { rot: 0, side: pt.sides[0], ...pt.placed } : null;
    }
    p.nets = (p.nets || []).map((n) => ({ width: 1, ...n }));
    p.satellites = (p.satellites || []).map((s) => {
      const K = SAT_KINDS[s.kind];
      const o = { label: K.label, max_dist: K.max, pinned: false, ...s };
      o.placed = s.placed ? { rot: 0, side: 'top', ...s.placed } : null;
      return o;
    });
    p.rules = p.rules || [];
    return p;
  }

  // ---------- 坐标变换 ----------
  function dims(w, h, rot) { return rot === 90 || rot === 270 ? [h, w] : [w, h]; }
  function footprint(part, pl) {
    pl = pl || part.placed;
    if (!pl) return null;
    const [w, h] = dims(part.w, part.h, pl.rot || 0);
    return G.rectFromCenter(pl.x, pl.y, w, h);
  }
  /** 局部坐标（器件中心为原点、未旋转、正面视角）→ 世界坐标。背面器件从正面看是镜像的。 */
  function toWorld(lx, ly, pl) {
    if (pl.side === 'bottom') lx = -lx;
    const a = ((pl.rot || 0) * Math.PI) / 180;
    const c = Math.round(Math.cos(a)), s = Math.round(Math.sin(a));
    return { x: pl.x + lx * c - ly * s, y: pl.y + lx * s + ly * c };
  }
  function dirToWorld(nx, ny, pl) {
    if (pl.side === 'bottom') nx = -nx;
    const a = ((pl.rot || 0) * Math.PI) / 180;
    const c = Math.round(Math.cos(a)), s = Math.round(Math.sin(a));
    return { x: nx * c - ny * s, y: nx * s + ny * c };
  }
  const SIDE_NORMAL = { N: [0, 1], S: [0, -1], E: [1, 0], W: [-1, 0], C: [0, 0] };
  function pinLocal(part, pin) {
    const w = part.w, h = part.h, t = pin.pos;
    switch (pin.side) {
      case 'N': return { x: -w / 2 + t * w, y: h / 2 };
      case 'S': return { x: -w / 2 + t * w, y: -h / 2 };
      case 'E': return { x: w / 2, y: h / 2 - t * h };
      case 'W': return { x: -w / 2, y: h / 2 - t * h };
      default: return { x: 0, y: 0 };
    }
  }
  /** 引脚组的世界坐标与朝外法向。 */
  function pinWorld(part, pinId, pl) {
    pl = pl || part.placed;
    const pin = part.pins.find((q) => q.id === pinId);
    if (!pin || !pl) return null;
    const l = pinLocal(part, pin);
    const p = toWorld(l.x, l.y, pl);
    const [nx, ny] = SIDE_NORMAL[pin.side];
    const n = dirToWorld(nx, ny, pl);
    return { x: p.x, y: p.y, nx: n.x, ny: n.y, count: pin.count, side: pin.side };
  }
  /** 局部的边（N/E/S/W）在世界坐标中朝向哪一边。 */
  function worldSide(localSide, pl) {
    const [nx, ny] = SIDE_NORMAL[localSide];
    const n = dirToWorld(nx, ny, pl);
    if (n.x > 0.5) return 'E';
    if (n.x < -0.5) return 'W';
    if (n.y > 0.5) return 'N';
    return 'S';
  }
  function satFootprint(sat, pl) {
    pl = pl || sat.placed;
    if (!pl) return null;
    const [w, h] = dims(sat.w, sat.h, pl.rot || 0);
    return G.rectFromCenter(pl.x, pl.y, w, h);
  }

  // ---------- 查询 ----------
  function partByRef(p, ref) { return p.parts.find((x) => x.ref === ref) || null; }
  function satByRef(p, ref) { return p.satellites.find((x) => x.ref === ref) || null; }
  function itemByRef(p, ref) { return partByRef(p, ref) || satByRef(p, ref); }
  function placedParts(p) { return p.parts.filter((x) => x.placed); }
  function partTags(pt) {
    const t = new Set([pt.role, 'part']);
    if (pt.heat_mw > 50 || pt.role === 'charger' || pt.role === 'ldo') t.add('heat');
    if (pt.role === 'dcdc') t.add('switching');
    if (pt.role === 'inductor') { t.add('inductor'); t.add('switching'); }
    if (['inductor', 'battery', 'motor_driver'].includes(pt.role)) t.add('magnetic_source');
    if (SENSOR_ROLES.includes(pt.role)) t.add('sensor');
    if (pt.role === 'rf_module') t.add('shield');
    return t;
  }
  function satTags(s) {
    const t = new Set([s.kind, 'sat']);
    if (s.kind === 'crystal') t.add('crystal');
    if (s.kind === 'dcdc_inductor') { t.add('inductor'); t.add('switching'); t.add('magnetic_source'); }
    return t;
  }
  /** 器件之间是否有网络相连。返回 Map<ref, Set<netClass>>。 */
  function connectedParts(p, ref) {
    const out = new Map();
    for (const n of p.nets) {
      if (!n.pins.some((q) => q[0] === ref)) continue;
      for (const q of n.pins) {
        if (q[0] === ref) continue;
        if (!out.has(q[0])) out.set(q[0], new Set());
        out.get(q[0]).add(n.class);
      }
    }
    return out;
  }
  /** 解析电容值文本（如 "100nF"、"4.7uF"）为法拉，解析失败返回 Infinity。 */
  function parseCap(v) {
    if (typeof v !== 'string') return Infinity;
    const m = v.trim().match(/^([\d.]+)\s*([pnuµm]?)F?/i);
    if (!m) return Infinity;
    const mul = { p: 1e-12, n: 1e-9, u: 1e-6, 'µ': 1e-6, m: 1e-3, '': 1 }[m[2].toLowerCase()] ?? 1;
    return parseFloat(m[1]) * mul;
  }

  // ---------- 板框形状 ----------
  /** 可选的板框形状。rect/stadium/circle 用解析形状；chamfer/lshape/custom 存为多边形，并记下 shape 与参数以便再次编辑。 */
  const BOARD_SHAPES = ['rect', 'stadium', 'chamfer', 'lshape', 'circle', 'custom'];
  /** 由形状和参数生成板框。参数：w、h、r（圆角）、c（倒角）、nw/nh（L 形右上角缺口）、d（直径）、points（自定义）。 */
  function outlineFromShape(shape, q) {
    const w = q.w, h = q.h;
    switch (shape) {
      case 'circle': return { type: 'circle', d: q.d };
      case 'stadium': return { type: 'rect', w, h, corner_r: Math.min(w, h) / 2, shape: 'stadium' };
      case 'chamfer': {
        const c = Math.max(0.5, Math.min(q.c ?? 3, w / 2 - 0.5, h / 2 - 0.5));
        return { type: 'polygon', shape: 'chamfer', w, h, c, points: [[c, 0], [w - c, 0], [w, c], [w, h - c], [w - c, h], [c, h], [0, h - c], [0, c]] };
      }
      case 'lshape': {
        const nw = Math.max(1, Math.min(q.nw ?? w * 0.4, w - 2)), nh = Math.max(1, Math.min(q.nh ?? h * 0.4, h - 2));
        return { type: 'polygon', shape: 'lshape', w, h, nw, nh, points: [[0, 0], [w, 0], [w, h - nh], [w - nw, h - nh], [w - nw, h], [0, h]] };
      }
      case 'custom': return { type: 'polygon', shape: 'custom', points: q.points.map((pt) => [r2(pt[0]), r2(pt[1])]) };
      case 'rect': default: return { type: 'rect', w, h, corner_r: Math.max(0, q.r ?? 0) };
    }
  }
  /** 当前板框属于哪种形状（供界面回显）。 */

      if (bits >= 8) { bits -= 8; out[k++] = (acc >> bits) & 255; }
    }
    return out.subarray(0, k);
  }
  /** 三字节一组的游程编码 → 0..1 覆盖率。 */
  function rleDecode(s, N) {
    const b = b64(s), out = new Float32Array(N);
    let k = 0;
    for (let i = 0; i + 2 < b.length; i += 3) {
      const n = b[i] | (b[i + 1] << 8), v = b[i + 2] / 255;
      if (v) out.fill(v, k, Math.min(N, k + n));
      k += n;
    }
    return out;
  }

  /** 读入数据包：只建索引，覆盖率在用到时才解码并缓存。 */
  function load(pack) {
    if (!pack || pack.kind !== 'copper-pack') throw new Error('不是铜皮数据包（kind 应为 copper-pack）');
    const N = pack.grid.nx * pack.grid.ny, cache = new Map();
    const nets = new Map(pack.nets.map((n) => [n.name, n]));
    return {
      ...pack, nets, N,
      netCov(name, l) {
        const k = 'n:' + name + ':' + l;
        if (!cache.has(k)) { const n = nets.get(name); const s = n && n.cov && n.cov[String(l)]; cache.set(k, s ? rleDecode(s, N) : null); }
        return cache.get(k);
      },
      groupCov(g, l) {
        const k = 'g:' + g + ':' + l;
        if (!cache.has(k)) { const s = pack.cov[g] && pack.cov[g][String(l)]; cache.set(k, s ? rleDecode(s, N) : null); }
        return cache.get(k);
      },
    };
  }

  /** 让项目的板框、器件位置与实际布板一致（以铜皮数据包为准）。 */
  function alignProject(raw, pack) {
    const p = JSON.parse(JSON.stringify(raw));
    p.board.outline = { type: 'polygon', points: pack.board.outline };
    const byRef = new Map(pack.parts.map((q) => [q.ref, q]));
    for (const list of [p.parts || [], p.satellites || []]) for (const it of list) {
      const q = byRef.get(it.ref);
      if (!q) continue;
      it.placed = { ...(it.placed || { rot: 0 }), x: q.x, y: q.y, side: q.side };
    }
    return p;
  }

  /** 某网络在某器件上的焊盘所在格子（按层）。找不到时退回到引脚估计位置附近的铜。 */
  function padCells(st, net, ref, fallbackPt) {
    const pk = st.pack, n = pk.nets.get(net), g = st.g, out = [];
    if (n) for (const [r, , l, x, y] of n.pads) if (r === ref) out.push({ l, c: g.at(x, y), x, y });
    if (!out.length && fallbackPt) {
      let best = null;
      for (let l = 0; l < pk.layers.length; l++) {
        const cov = pk.netCov(net, l);
        if (!cov) continue;
        const c = LP.current.nearestIn(g, cov.map((v) => (v > 0.05 ? 1 : 0)), fallbackPt.x, fallbackPt.y);
        if (c < 0) continue;
        const d = Math.hypot(g.cx(c % g.nx) - fallbackPt.x, g.cy((c / g.nx) | 0) - fallbackPt.y);
        if (!best || d < best.d) best = { l, c, d, x: g.cx(c % g.nx), y: g.cy((c / g.nx) | 0) };
      }
      if (best && best.d < 3) out.push(best);
    }
    return out;
  }

  /**
   * 在一个网络的多层铜皮上求解：src 处固定 0 V，sink 处抽出电流 I。
   * 返回每层的 {fx, fy, mag(A/mm²)} 合成（每格取电流最大的那层）、过孔电流、压降。
   */
  function solveNet(st, net, src, sink, I) {
    const pk = st.pack, g = st.g, nx = g.nx, ny = g.ny, N = nx * ny, L = pk.layers.length;
    const oz = (l) => (st.v.stackup.cu_oz[l] ?? (l === 0 || l === L - 1 ? 1 : 0.5));
    const covs = [], idx = [];
    let n = 0;
    const links = [], gl = [], coords = [];
    for (let l = 0; l < L; l++) {
      const cov = pk.netCov(net, l);
      covs.push(cov);
      const ix = new Int32Array(N).fill(-1);
      if (cov) {
        const mask = new Uint8Array(N), coeff = new Float32Array(N), Gs = C.sheetG(oz(l));
        for (let c = 0; c < N; c++) if (cov[c] > 0.02) { mask[c] = 1; coeff[c] = cov[c] * Gs; }
        const lk = SV.gridLinks(nx, ny, mask, coeff);
        for (let a = 0; a < lk.n; a++) { ix[lk.cells[a]] = n + a; coords.push(l, lk.cells[a] % nx, (lk.cells[a] / nx) | 0); }
        for (let k = 0; k < lk.g.length; k++) { links.push(lk.links[2 * k] + n, lk.links[2 * k + 1] + n); gl.push(lk.g[k]); }
        n += lk.n;
      }
      idx.push(ix);
    }
    if (!n) return null;
    // 过孔：连接相邻有铜的层；通孔焊盘同样处理
    const nn = pk.nets.get(net);
    const viaList = [];
    const tie = (x, y, gv) => {
      const c = g.at(x, y), ls = [];
      for (let l = 0; l < L; l++) if (idx[l][c] >= 0) ls.push(l);
      for (let q = 1; q < ls.length; q++) { links.push(idx[ls[q - 1]][c], idx[ls[q]][c]); gl.push(gv); viaList.push({ x, y, c, a: ls[q - 1], b: ls[q], k: gl.length - 1 }); }
    };
    if (nn) {
      for (const [x, y] of nn.vias) tie(x, y, 1 / C.VIA_R_OHM);
      for (const [, , l, x, y] of nn.pads) if (l === -1) tie(x, y, 4 / C.VIA_R_OHM);
    }
    const diag = new Float64Array(n);
    let gmax = 0; for (const w of gl) gmax = Math.max(gmax, w);
    const fixedNodes = [];
    for (const s of src) { const ls = s.l === -1 ? [...Array(L).keys()] : [s.l]; for (const l of ls) { const a = idx[l][s.c]; if (a >= 0) { diag[a] += gmax * 1e6; fixedNodes.push(a); } } }
    const b = new Float64Array(n);
    const sinkNodes = [];
    for (const s of sink) { const ls = s.l === -1 ? [...Array(L).keys()] : [s.l]; for (const l of ls) { const a = idx[l][s.c]; if (a >= 0) sinkNodes.push(a); } }
    if (!fixedNodes.length || !sinkNodes.length) return null;
    // 连通性：只保留与电源起点连通的负载焊盘；一个都不连通就报不连通
    const par = new Int32Array(n); for (let a = 0; a < n; a++) par[a] = a;
    const fd = (a) => { while (par[a] !== a) { par[a] = par[par[a]]; a = par[a]; } return a; };
    for (let k = 0; k < links.length; k += 2) { const x = fd(links[k]), y = fd(links[k + 1]); if (x !== y) par[x] = y; }
    const roots = new Set(fixedNodes.map(fd));
    const live = sinkNodes.filter((a) => roots.has(fd(a)));
    if (!live.length) return { disconnected: true };
    sinkNodes.length = 0; sinkNodes.push(...live);
    for (let a = 0; a < n; a++) diag[a] += gmax * 1e-9;     // 让与起点不连通的铜块也有确定解（电位约为 0）
    for (const a of sinkNodes) b[a] -= I / sinkNodes.length;
    const A = SV.assemble(n, Int32Array.from(links), Float64Array.from(gl), diag);
    const levels = n > 1500 ? SV.amgSetup(A, Int32Array.from(coords)) : null;
    const r = SV.pcg(A, b, { tol: 1e-5, levels, maxIt: 3000 });
    // 每层的片电流（A/m）→ 体电流密度（A/mm²，按覆盖率还原到铜本身）
    const fx = new Float32Array(N), fy = new Float32Array(N), mag = new Float32Array(N), layerOf = new Int8Array(N).fill(-1);
    const K = [];
    for (let l = 0; l < L; l++) {
      if (!covs[l]) { K.push(null); continue; }
      const u = new Float32Array(N).fill(NaN), coeff = new Float32Array(N), Gs = C.sheetG(oz(l));
      for (let c = 0; c < N; c++) { const a = idx[l][c]; if (a >= 0) { u[c] = r.x[a]; coeff[c] = covs[l][c] * Gs; } }
      const fl = SV.flux(nx, ny, u, coeff, g.cell / 1000);
      K.push(fl);
      const t = oz(l) * C.OZ_UM / 1000;
      for (let c = 0; c < N; c++) {
        if (!(fl.mag[c] > 0)) continue;
        const j = fl.mag[c] / 1000 / t / Math.max(covs[l][c], 0.05);
        if (j > mag[c]) { mag[c] = j; const k = j / fl.mag[c]; fx[c] = fl.fx[c] * k; fy[c] = fl.fy[c] * k; layerOf[c] = l; }
      }
    }
    let vmin = 0; for (const a of sinkNodes) vmin = Math.min(vmin, r.x[a]);
    let vs = 0; for (const a of sinkNodes) vs += r.x[a];
    const vias = viaList.map((q) => ({ x: q.x, y: q.y, I: Math.abs(gl[q.k] * (r.x[idx[q.a][q.c]] - r.x[idx[q.b][q.c]])) }));
    return { fx, fy, mag, layerOf, K, covs, drop: -vs / sinkNodes.length, vias, iters: r.iters };
  }

  function maxPath(st, field, from, to) {
    const g = st.g, N = g.nx * g.ny, mask = new Uint8Array(N);
    let mx = 0; for (let c = 0; c < N; c++) if (field.mag[c] > 0) { mask[c] = 1; mx = Math.max(mx, field.mag[c]); }
    if (!mask[from] || !mask[to]) { mask[from] = 1; mask[to] = 1; }
    const cost = new Float32Array(N);
    for (let c = 0; c < N; c++) cost[c] = mask[c] ? 1 / (field.mag[c] / (mx || 1) + 0.02) : 0;
    const path = R.astar(g.nx, g.ny, cost, from, to);
    return path ? R.toPolyline(g, path, 2) : [];
  }

  /** 阶段 R 的电流分析：与阶段 P 返回相同结构，供界面直接使用。 */
  function analyzeCurrent(st, li, opts = {}) {
    const { v, p, g } = st, load = v.loads[li];
    const ep = LP.current.endpoints(st, load);
    if (!ep) return { error: '找不到该负载的电源起点' };
    const I = Math.max(1e-4, (load.i_avg_ma || 0) / 1000), Ipk = (load.i_peak_ma || 0) / 1000;
    const out = { ref: load.part, net: load.net, kind: load.kind, I, Ipk, stage: 'R', supMode: 'copper', retMode: 'copper', pins: { src: ep.a, load: ep.b, srcGnd: ep.ag, loadGnd: ep.bg }, findings: [] };
    const sSrc = padCells(st, load.net, ep.src.part, ep.a), sLoad = padCells(st, load.net, load.part, ep.b);
    const gSrc = padCells(st, st.gnd, ep.src.part, ep.ag), gLoad = padCells(st, st.gnd, load.part, ep.bg);
    if (!sSrc.length || !sLoad.length) return { error: `在铜皮数据里找不到 ${load.net} 在 ${ep.src.part} 或 ${load.part} 上的焊盘：检查网络名是否与原理图一致` };
    const sup = solveNet(st, load.net, sSrc, sLoad, I);
    if (!sup || sup.disconnected) return { error: `${load.net} 在铜皮上从 ${ep.src.part} 到 ${load.part} 不连通：检查是否漏线或少过孔` };
    out.sup = { fx: sup.fx, fy: sup.fy, mag: sup.mag };
    out.supPts = maxPath(st, sup, sSrc[0].c, sLoad[0].c);
    out.supLen = R.polyLen(out.supPts);
    let ret = null;
    if (gSrc.length && gLoad.length) ret = solveNet(st, st.gnd, gSrc, gLoad, I);
    if (ret && ret.disconnected) ret = null;
    if (ret) {
      // 回流方向：从负载地流回电源地
      for (let c = 0; c < ret.fx.length; c++) { ret.fx[c] = -ret.fx[c]; ret.fy[c] = -ret.fy[c]; }
      out.ret = { fx: ret.fx, fy: ret.fy, mag: ret.mag };
      out.retPts = maxPath(st, ret, gLoad[0].c, gSrc[0].c);
      out.retLen = R.polyLen(out.retPts);
    } else {
      out.ret = { fx: new Float32Array(sup.fx.length), fy: new Float32Array(sup.fx.length), mag: new Float32Array(sup.fx.length) };
      out.retPts = []; out.retLen = 0;
      out.findings.push(F.finding(v, 'VF-05', { obj: load.part, title: `${load.part} 的地与电源起点的地在铜皮上不连通`, advice: '检查地网络是否漏连、铺铜是否填充', assume: '按铜皮数据包的地网络' }));
    }
    const h = v.stackup.h_mm || 0.2;
    out.loopArea = out.retPts.length ? R.loopArea(out.supPts, out.retPts) + out.supLen * h : null;
    out.dropV = sup.drop + (ret ? ret.drop : 0);
    out.vias = sup.vias.concat(ret ? ret.vias : []).sort((a, b) => b.I - a.I).slice(0, 12);
    out.wReq = Math.max(p.board.track || 0.15, C.ipcWidth(Math.max(I, Ipk / 2)));
    // VF-01：逐段导线按实际流过的电流核对线宽
    const n = st.pack.nets.get(load.net);
    let worst = null;
    for (const s of (n && n.segs) || []) {
      const [l, x1, y1, x2, y2, w] = s, Kl = sup.K[l];
      if (!Kl) continue;
      const c = g.at((x1 + x2) / 2, (y1 + y2) / 2);
      const Iseg = Kl.mag[c] * (g.cell / 1000);
      const need = C.ipcWidth(Iseg, st.v.stackup.cu_oz[l] ?? 1, l > 0 && l < st.pack.layers.length - 1);
      if (need > w && (!worst || need / w > worst.ratio)) worst = { ratio: need / w, w, need, Iseg, x: (x1 + x2) / 2, y: (y1 + y2) / 2 };
    }
    if (worst) out.findings.push(F.finding(v, 'VF-01', { obj: load.part, value: +worst.w.toFixed(2), where: { x: worst.x, y: worst.y },
      title: `${load.net} 有一段 ${worst.w.toFixed(2)} mm 的导线流过约 ${(worst.Iseg * 1000).toFixed(0)} mA，按 IPC-2221 需 ${worst.need.toFixed(2)} mm`,
      advice: `把这段加宽到 ${worst.need.toFixed(2)} mm 以上，或并联铺铜`, assume: 'IPC-2221，温升 10 °C；导线电流取求解结果' }));
    const r2 = F.rule(v, 'VF-02');
    const src = LP.current.sourceFor(st, load), Vs = (src && src.v) || 3.3;
    out.dropPct = (out.dropV / Vs) * 100;
    if (out.dropPct > r2.max_pct) out.findings.push(F.finding(v, 'VF-02', { obj: load.part, value: +out.dropPct.toFixed(2), where: { x: ep.b.x, y: ep.b.y },
      title: `${load.part} 的供电压降约 ${(out.dropV * 1000).toFixed(0)} mV（${out.dropPct.toFixed(1)}%，去程加回流）`, advice: '加宽电源和地的走线、增加过孔，或缩短路径', assume: `按平均电流 ${(I * 1000).toFixed(0)} mA、铜厚按叠层` }));
    const r3 = F.rule(v, 'VF-03');
    const hot = out.vias.find((q) => q.I > r3.max_a);
    if (hot) out.findings.push(F.finding(v, 'VF-03', { obj: load.part, value: +hot.I.toFixed(2), where: { x: hot.x, y: hot.y }, title: `一个过孔流过约 ${hot.I.toFixed(2)} A`, advice: '在旁边并联 2 个以上过孔', assume: `单孔上限 ${r3.max_a} A` }));
    // 高频负载：去程铜皮下方相邻层有没有地
    if (load.kind !== 'dc') {
      const L = st.pack.layers.length;
      let tot = 0, miss = 0, mx = 0, my = 0;
      for (let c = 0; c < sup.mag.length; c++) {
        const l = sup.layerOf[c];
        if (l < 0 || !(sup.mag[c] > 0)) continue;
        tot++;
        const adj = [l - 1, l + 1].filter((q) => q >= 0 && q < L);
        if (!adj.some((q) => { const gc = st.pack.netCov(st.gnd, q); return gc && gc[c] > 0.5; })) { miss++; mx += g.cx(c % g.nx); my += g.cy((c / g.nx) | 0); }
      }
      out.gapFrac = tot ? miss / tot : 0;
      if (out.gapFrac > 0.05) out.findings.push(F.finding(v, 'VF-05', { obj: load.part, value: +out.gapFrac.toFixed(2), where: { x: mx / miss, y: my / miss },
        title: `${load.part}（${load.kind === 'rf' ? '射频' : '开关'}负载）的供电铜皮约 ${(out.gapFrac * 100).toFixed(0)}% 下方相邻层没有地，高频回流要绕行`, advice: '在这些位置补地铜或调整走线层', assume: '相邻层地覆盖率 > 50% 才算有参考' }));
    }
    out.decaps = [];
    return out;
  }

  function thermalInputs(st) {
    const pk = st.pack, cov = [];
    for (let l = 0; l < pk.layers.length; l++) {
      const a = new Float32Array(pk.N);
      for (const g of Object.keys(pk.cov || {})) { const c = pk.groupCov(g, l); if (c) for (let i = 0; i < a.length; i++) a[i] = Math.min(1, a[i] + c[i]); }
      cov.push(a);
    }
    return { coverage: cov };
  }

  /** 网络几何（供电磁分析）：导线逐段采样。 */
  function netGeom(st) {
    const out = {}, L = st.pack.layers.length;
    for (const [name, n] of st.pack.nets) {
      if (!n.segs || !n.segs.length) continue;
      const pts = [];
      for (const [l, x1, y1, x2, y2] of n.segs) {
        const len = Math.hypot(x2 - x1, y2 - y1), k = Math.max(1, Math.ceil(len / 0.5));
        for (let q = 0; q <= k; q++) pts.push({ x: x1 + ((x2 - x1) * q) / k, y: y1 + ((y2 - y1) * q) / k, side: l === L - 1 ? 'bottom' : 'top' });
      }
      out[name] = pts;
    }
    return out;
  }

  function emiChecks(st) {
    const { v } = st, ck = st.pack.checks || {}, out = [];
    const r8 = F.rule(v, 'VF-08');
    for (const q of ck.rf || []) {
      const em = v.emitters.find((e) => e.net === q.net);
      const f = (em && em.f_hz) || 2.4e9, lim = C.lambdaMm(f, v.stackup.er) * r8.fence_frac;
      if (q.ref_ok < r8.min_ref) out.push(F.finding(v, 'VF-08', { obj: q.net, value: q.ref_ok, where: q.gaps[0] ? { x: q.gaps[0][0], y: q.gaps[0][1] } : null,
        title: `射频线 ${q.net} 只有 ${(q.ref_ok * 100).toFixed(0)}% 的长度下方有完整地平面`, advice: '补齐射频线下方相邻层的地，不要让槽、分割或孔从下面穿过', assume: '相邻层是地网络才算参考平面' }));
      if (q.fence_mm != null && q.fence_mm > lim) out.push(F.finding(v, 'VF-08', { obj: q.net, value: q.fence_mm, sev: 'P2',
        title: `射频线 ${q.net} 两侧地孔间距约 ${q.fence_mm} mm，大于 λ/20（${lim.toFixed(1)} mm）`, advice: `沿射频线两侧每 ${lim.toFixed(1)} mm 内打一个地孔`, assume: `频率 ${(f / 1e9).toFixed(2)} GHz，按微带有效介电常数估算波长` }));
    }
    const r9 = F.rule(v, 'VF-09');
    for (const q of ck.coupling || []) if (q.ratio > r9.max_ratio) out.push(F.finding(v, 'VF-09', { obj: q.a, value: q.ratio, where: q.at ? { x: q.at[0], y: q.at[1] } : null,
      title: `模拟线 ${q.a} 与 ${q.b} 在 L${q.layer + 1} 并行 ${q.len} mm、间距 ${q.gap} mm（比值 ${q.ratio}）`, advice: '拉开间距到 3 倍线宽以上、换层，或在中间加地线', assume: `并行长度 ÷ 间距 > ${r9.max_ratio}` }));
    for (const q of ck.islands || []) out.push(F.finding(v, 'VF-14', { value: q.area, where: { x: q.x, y: q.y },
      title: `L${q.layer + 1} 有一块 ${q.area} mm² 的地铜没有连到主地`, advice: '打过孔连到地平面，或删除这块铜', assume: '按地网络的连通性' }));
    return out;
  }

  /** 平面谐振用的实际地平面形状（降采样到长边约 64 格）。 */
  function planeShape(st) {
    const pk = st.pack, gl = (st.v.stackup.planes.find((q) => q.net === st.gnd) || {}).layer;
    let best = -1, bestSum = 0;
    for (let l = 0; l < pk.layers.length; l++) { const c = pk.netCov(st.gnd, l); if (!c) continue; let s = 0; for (const v of c) s += v; if (l === gl) s *= 1.5; if (s > bestSum) { bestSum = s; best = l; } }
    if (best < 0) return {};
    const cov = pk.netCov(st.gnd, best), g = st.g;
    const f = Math.max(1, Math.ceil(Math.max(g.nx, g.ny) / 64));
    const cg = V.makeGrid(st.p.board.outline, 64, 0.1, { cell: g.cell * f, x0: g.x0, y0: g.y0, nx: Math.ceil(g.nx / f), ny: Math.ceil(g.ny / f) });
    const mask = new Uint8Array(cg.nx * cg.ny);
    for (let j = 0; j < cg.ny; j++) for (let i = 0; i < cg.nx; i++) {

      if (this.frames.length < 30) return;
      const avg = this.frames.reduce((a, b) => a + b, 0) / this.frames.length;
      this.frames = [];
      this.lastAvg = avg;
      if (avg > 12 && this.level < 3) { this.level++; this.reset(); if (this.onDegrade) this.onDegrade(this.level); }
    }
    step(dt) {
      const v = this.v, c = this.cv.getContext('2d'), dpr = v.dpr;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (this.level < 2) {
        c.globalCompositeOperation = 'destination-out';
        c.fillStyle = 'rgba(0,0,0,0.12)';
        c.fillRect(0, 0, v.W, v.H);
      } else c.clearRect(0, 0, v.W, v.H);
      c.globalCompositeOperation = 'lighter';
      const size = Math.max(v.board.w, v.board.h);
      const BUCKETS = 8;
      for (const s of this.systems) {
        const paths = Array.from({ length: BUCKETS }, () => []);
        const sp = (s.speed ?? 1) * size / 2.5;
        for (let k = 0; k < s.n; k++) {
          const o = 4 * k;
          if (s.p[o + 3] < 0) continue;
          let x = s.p[o], y = s.p[o + 1];
          const cidx = this.sample(s, x, y);
          const m = cidx >= 0 ? s.mag[cidx] : 0;
          s.p[o + 2] += 1;
          if (!(m > s.lo) || s.p[o + 2] > s.p[o + 3]) { this.spawn(s, k, false); continue; }
          const tn = Math.max(0, Math.min(1, (Math.log10(m) - s.L0) / (s.L1 - s.L0 || 1)));
          const ux = s.fx[cidx] / m, uy = s.fy[cidx] / m;
          const step = sp * (0.25 + 0.75 * tn) * dt;
          let nx = x + ux * step, ny = y + uy * step;
          if (s.jitter && s.jitter[cidx] > 0) { const jv = (Math.random() - 0.5) * s.jitter[cidx] * 0.6; nx += -uy * jv; ny += ux * jv; }
          s.p[o] = nx; s.p[o + 1] = ny;
          const b = Math.min(BUCKETS - 1, Math.floor(tn * BUCKETS));
          paths[b].push(v.sx(x), v.sy(y), v.sx(nx), v.sy(ny));
        }
        for (let b = 0; b < BUCKETS; b++) {
          const arr = paths[b];
          if (!arr.length) continue;
          const t = (b + 0.5) / BUCKETS, col = PR.palette(s.pal, 0.35 + 0.65 * t);
          c.strokeStyle = PR.rgb(col, (s.alpha ?? 0.8) * (0.35 + 0.65 * t));
          c.lineWidth = 0.8 + 1.4 * t;
          c.lineCap = 'round';
          c.beginPath();
          for (let q = 0; q < arr.length; q += 4) { c.moveTo(arr[q], arr[q + 1]); c.lineTo(arr[q + 2], arr[q + 3]); }
          c.stroke();
          if (this.level < 1 && t > 0.6) {          // 头部亮点
            c.fillStyle = PR.rgb([255, 250, 230], 0.5 * t);
            for (let q = 0; q < arr.length; q += 4) c.fillRect(arr[q + 2] - 0.8, arr[q + 3] - 0.8, 1.6, 1.6);
          }
        }
      }
      c.globalCompositeOperation = 'source-over';
    }
    /** 静态流线：线的粗细与亮度随强度变化，带箭头。用于关闭动效或性能不足时。 */
    drawStatic() {
      this.pause();
      this.static = true;
      const v = this.v, c = this.cv.getContext('2d');
      c.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
      c.clearRect(0, 0, v.W, v.H);
      c.globalCompositeOperation = 'lighter';
      for (const s of this.systems) {
        const seeds = Math.round(160 * (s.share ?? 1 / this.systems.length));
        const h = s.grid.cell * 0.8;
        for (let k = 0; k < seeds; k++) {
          this.spawn(s, 0, true);
          let x = s.p[0], y = s.p[1];
          const pts = [[x, y]];
          for (let it = 0; it < 220; it++) {
            const ci = this.sample(s, x, y), m = ci >= 0 ? s.mag[ci] : 0;
            if (!(m > s.lo)) break;
            x += (s.fx[ci] / m) * h; y += (s.fy[ci] / m) * h;
            pts.push([x, y]);
          }
          if (pts.length < 4) continue;
          const ci = this.sample(s, pts[0][0], pts[0][1]);
          const tn = ci >= 0 ? Math.max(0, Math.min(1, (Math.log10(Math.max(s.mag[ci], 1e-12)) - s.L0) / (s.L1 - s.L0 || 1))) : 0.3;
          c.strokeStyle = PR.rgb(PR.palette(s.pal, 0.35 + 0.65 * tn), 0.25 + 0.6 * tn);
          c.lineWidth = 0.6 + 2 * tn;
          c.beginPath(); pts.forEach((q, i) => (i ? c.lineTo(v.sx(q[0]), v.sy(q[1])) : c.moveTo(v.sx(q[0]), v.sy(q[1])))); c.stroke();
          const m = Math.floor(pts.length / 2), a = pts[m - 1], b = pts[m];
          const ang = Math.atan2(-(b[1] - a[1]), b[0] - a[0]), X = v.sx(b[0]), Y = v.sy(b[1]), L = 5 + 3 * tn;
          c.beginPath(); c.moveTo(X, Y); c.lineTo(X - L * Math.cos(ang - 0.5), Y - L * Math.sin(ang - 0.5)); c.moveTo(X, Y); c.lineTo(X - L * Math.cos(ang + 0.5), Y - L * Math.sin(ang + 0.5)); c.stroke();
        }
      }
      c.globalCompositeOperation = 'source-over';
    }
  }

<script>
/* ---- js/client.js ---- */
// 计算客户端：优先在 Blob Worker 里计算；创建失败时在主线程执行同一段代码（分批让出，界面不冻结）。
(function (LP) {
  'use strict';
  class Client {
    constructor() {
      this.src = (document.getElementById('worker-src') || {}).textContent || '';
      this.seq = 0; this.pending = new Map(); this.mode = 'worker';
      try {
        const url = URL.createObjectURL(new Blob([this.src], { type: 'text/javascript' }));
        this.w = new Worker(url);
        this.w.onmessage = (e) => this.done(e.data);
        this.w.onerror = (e) => { e.preventDefault(); this.fallback('Worker 出错：' + (e.message || '')); };
      } catch (err) {
        this.fallback(String(err));
      }
    }
    fallback(why) {
      if (this.mode === 'main') return;
      this.mode = 'main'; this.why = why;
      if (this.w) { try { this.w.terminate(); } catch (e) { /* 忽略 */ } this.w = null; }
      if (!LP.analysis) (0, eval)(this.src);
      // 把已经发出的请求改在主线程执行
      const list = [...this.pending.values()];
      this.pending.clear();
      for (const p of list) this.runLocal(p);
    }
    done(msg) {
      const p = this.pending.get(msg.id);
      if (!p) return;
      this.pending.delete(msg.id);
      if (msg.error) p.reject(new Error(msg.error)); else p.resolve(msg.result);
    }
    runLocal(p) {
      setTimeout(() => {
        try { p.resolve(LP.analysis[p.op](...p.args)); } catch (err) { p.reject(err); }
      }, 0);
    }
    call(op, ...args) {
      return new Promise((resolve, reject) => {
        const id = ++this.seq, p = { id, op, args, resolve, reject };
        if (this.mode === 'worker' && this.w) { this.pending.set(id, p); this.w.postMessage({ id, op, args }); }
        else this.runLocal(p);
      });
    }
  }
  LP.Client = Client;
})(globalThis.LP = globalThis.LP || {});

    // ---------- 电磁 ----------
    async showEmi() {
      const s = this.sum;
      const left = $('left');
      const sub = this.sel.emiSub;
      put(left,

      );

    async showEmiMap() {

        kv(r.victims.map((v) => [v.label, `${GRADE[v.grade]}（${fmt(v.level, 0)} dB）· ${v.top.map((t) => `${t.label} ${fmt(t.db, 0)}`).join('，')}`])),

    },
    async showModes() {

          h('b', {}, `第 ${i + 1} 模`), h('span', {}, fhz(m.f)), m.near.length ? h('em', { class: 'warn' }, '接近工作频率') : null))),

    // ---------- 温度 ----------
    thermalOpts(withMeasures) {
      const o = { env: { ta_c: this.opt.ta } };

      o.heatsinks = { ...this.opt.heatsinks };
      o.env.airflow_m_s = this.opt.airflow;

    },
    async showThermal() {
      const s = this.sum;
      const hsOpts = [['0', '无'], ['0.05', '小（约 20 K/W）'], ['0.1', '中（约 10 K/W）'], ['0.25', '大（约 4 K/W）']];
      put($('left'), 
        h('h3', {}, '发热器件'),
        h('div', { class: 'list' }, s.thermal.map((t) => h('div', { class: 'item' + (t.part === this.sel.heatRef ? ' sel' : ''), onclick: (e) => { if (e.target.tagName === 'SELECT') return; this.sel.heatRef = t.part; this.showThermal(); } },
          h('b', {}, t.part), h('span', {}, `${fmt(t.p_w * 1000, t.p_w < 0.1 ? 1 : 0)} mW`), t.def ? h('em', {}, '默认值') : null,
          h('select', { class: 'mini', title: '散热器', onchange: (e) => { const v = +e.target.value; if (v) this.opt.heatsinks[t.part] = v; else delete this.opt.heatsinks[t.part]; this.showThermal(); } },
            hsOpts.map(([v, l]) => h('option', { value: v, selected: String(this.opt.heatsinks[t.part] || 0) === v ? true : null }, '散热器：' + l)))))),
        h('h3', {}, '散热措施（右半边）'),
        sel('空气', [['0', '自然对流'], ['0.5', '微风 0.5 m/s'], ['1', '风扇 1 m/s'], ['2', '风扇 2 m/s']], String(this.opt.airflow), (v) => { this.opt.airflow = +v; this.showThermal(); }),
        chk('各信号层大面积铺铜', this.opt.fullCopper, (v) => { this.opt.fullCopper = v; this.showThermal(); }),
        h('h3', {}, '环境'),
        num('环境温度 °C', this.opt.ta, (v) => { this.opt.ta = v; this.showThermal(); }),
        chk('密闭外壳（壳内升温 10 K/W）', this.opt.sealed, (v) => { this.opt.sealed = v; this.showThermal(); }),
        h('h3', {}, '显示'),
        chk('左右对比：无散热 | 有散热', this.opt.compare, (v) => { this.opt.compare = v; this.showThermal(); }),
        legendBox('heat', '板温 °C', 'th-legend'),
      );
      const base = await this.run('thermal', [this.thermalOpts(false)], '正在求温度分布…');
      if (!base || this.tab !== 'thermal') return;
      const cfg = await this.run('thermal', [this.thermalOpts(true)], '正在求加散热后的温度…');
      if (!cfg || this.tab !== 'thermal') return;
      this.res.thermal = { base, cfg };
      this.drawThermal();
    },
    drawThermal() {
      const { base, cfg } = this.res.thermal, g = this.sum.grid;
      const lo = base.ta, hi = Math.max(base.tmax, cfg.tmax, lo + 5);
      const cmp = this.opt.compare, sp = this.opt.split;
      const heats = cmp
        ? [{ field: base.T, grid: g, pal: 'heat', min: lo, max: hi, alpha: 0.9, clip: [0, sp] }, { field: cfg.T, grid: g, pal: 'heat', min: lo, max: hi, alpha: 0.9, clip: [sp, 1] }]
        : [{ field: cfg.T, grid: g, pal: 'heat', min: lo, max: hi, alpha: 0.9 }];
      this.viewer.setHeats(heats);
      $('th-legend-range').textContent = `${fmt(lo, 1)} – ${fmt(hi, 1)}`;
      this.hoverFields = cmp ? [{ f: base.T, g, label: '无散热', unit: '°C', d: 1, clip: [0, sp] }, { f: cfg.T, g, label: '有散热', unit: '°C', d: 1, clip: [sp, 1] }] : [{ f: cfg.T, g, label: '板温', unit: '°C', d: 1 }];
      const levels = [];
      for (let k = 1; k <= 5; k++) levels.push(lo + ((hi - lo) * k) / 6);
      let contours = [];
      for (const L of levels) contours = contours.concat(PR.contour(cfg.T, g, L));
      const vx = (x) => this.viewer.sx(x) / this.viewer.W;
      const half = (res, left) => {
        const sp2 = new Float32Array(res.flux.length);
        for (let c = 0; c < sp2.length; c++) { const x = g.x0 + ((c % g.nx) + 0.5) * g.cell, f = vx(x); sp2[c] = !cmp || (left ? f < sp : f >= sp) ? res.flux[c] : 0; }
        return sp2;
      };
      let fh = 0; for (const r of [base, cfg]) for (let c = 0; c < r.flux.length; c++) fh = Math.max(fh, r.flux[c]);
      const sys = cmp
        ? [{ fx: base.fx, fy: base.fy, mag: base.flux, spawn: half(base, true), grid: g, pal: 'fire', share: 0.35, lo: fh * 1e-3, hi: fh, speed: 0.4, alpha: 0.4 },
          { fx: cfg.fx, fy: cfg.fy, mag: cfg.flux, spawn: half(cfg, false), grid: g, pal: 'fire', share: 0.35, lo: fh * 1e-3, hi: fh, speed: 0.4, alpha: 0.4 }]
        : [{ fx: cfg.fx, fy: cfg.fy, mag: cfg.flux, grid: g, pal: 'fire', share: 0.7, lo: fh * 1e-3, hi: fh, speed: 0.4, alpha: 0.4 }];
      this.parts.set(sys); this.parts.start();
      const ref = this.sel.heatRef;
      const pb = base.parts.find((q) => q.ref === ref), pc = cfg.parts.find((q) => q.ref === ref);
      const it = this.sum.items.find((x) => x.ref === ref);
      const measures = [this.opt.heatsinks[ref] ? '加散热器' : null, this.opt.airflow ? `风速 ${this.opt.airflow} m/s` : null, this.opt.fullCopper ? '大面积铺铜' : null].filter(Boolean);
      this.overlayExtra = { contours, split: cmp ? sp : null, splitLabels: ['无散热', '有散热'],
        callout: pb && pc && it ? { x: (it.rect.x0 + it.rect.x1) / 2, y: (it.rect.y0 + it.rect.y1) / 2, big: cmp ? `${fmt(pb.tj, 0)} °C → ${fmt(pc.tj, 0)} °C` : `${fmt(pc.tj, 0)} °C`, small: `${ref} 结温 · 同样功耗${measures.length ? ' · ' + measures.join('、') : ''}` } : null };
      this.viewer.highlight = new Set(ref ? [ref] : []);
      this.drawOverlay();
      put($('right'), 
        h('h3', {}, '温度'),
        kv([['环境', `${fmt(base.ta, 1)} °C`], ['总功耗', `${fmt(base.P * 1000, 0)} mW`], ['板面最高', `无散热 ${fmt(base.tmax, 1)} °C · 有散热 ${fmt(cfg.tmax, 1)} °C`], ['能量核对', `散出 ${fmt(cfg.loss * 1000, 1)} mW / 输入 ${fmt(cfg.P * 1000, 1)} mW`]]),
        h('h4', {}, '器件结温（无散热 → 有散热）'),
        kv(base.parts.map((q) => { const c = cfg.parts.find((x) => x.ref === q.ref); return [q.ref, `${fmt(q.tj, 1)} → ${fmt(c ? c.tj : null, 1)} °C（板 ${fmt(c ? c.tb : q.tb, 1)} °C，上限 ${q.tjmax} °C）`]; })),
        this.findingsBox(cfg.findings),
      );
    },
    applyThermalClip() {
      if (!this.res.thermal || !this.opt.compare) return;
      if (this.viewer.heats.length === 2) { this.viewer.heats[0].h.clip = [0, this.opt.split]; this.viewer.heats[1].h.clip = [this.opt.split, 1]; this.viewer.drawBase(); }
      if (this.overlayExtra) this.overlayExtra.split = this.opt.split;
      this.drawOverlay();
    },

    // ---------- 标注、提示、结论 ----------
    drawOverlay() {
      const o = { ...(this.overlayExtra || {}) };
      if (this.tab === 'current' && this.res.current && !this.res.current.error) {
        const r = this.res.current, p = r.pins;
        o.marks = [{ x: p.src.x, y: p.src.y, color: '#7ee787', label: '电源起点' }, { x: p.load.x, y: p.load.y, color: '#ffd166', label: '负载' }];
        if (this.opt.ret) o.marks.push({ x: p.loadGnd.x, y: p.loadGnd.y, color: '#79c0ff', r: 4, label: '地' }, { x: p.srcGnd.x, y: p.srcGnd.y, color: '#79c0ff', r: 4 });
        o.lines = [];
        if (this.opt.sup && r.supPts) o.lines.push({ pts: r.supPts, color: 'rgba(255,190,120,0.45)' });
        if (this.opt.ret && r.retPts && r.retMode !== 'image') o.lines.push({ pts: r.retPts, color: 'rgba(120,200,255,0.45)' });
        o.findings = r.findings || [];
      }
      if (this.tab === 'emi' && this.sel.emiSub === 'map' && this.res.emi) o.findings = this.res.emi.findings;
      if (this.tab === 'emi' && this.sel.emiSub === 'modes' && this.res.modes) o.findings = this.res.modes.findings || [];
      if (this.tab === 'thermal' && this.res.thermal) o.findings = this.res.thermal.cfg.findings;
      if (this.focus != null && o.findings && o.findings[this.focus]) o.findings = o.findings.map((f, i) => (i === this.focus ? { ...f, focus: true } : f));
      if (this.tab !== 'thermal' && !(this.tab === 'emi' && this.sel.emiSub === 'modes')) this.overlayExtra = null;
      this.viewer.setOverlay(o);
    },
    findingsBox(list) {
      this.focus = null;
      const box = h('div', { class: 'findings' }, h('h4', {}, list.length ? `结论（${list.length}）` : '结论'));
      if (!list.length) box.append(h('p', { class: 'ok' }, '这一项没有发现问题。'));
      list.forEach((f, i) => box.append(h('button', { class: 'card sev-' + f.sev, onclick: () => { this.focus = i; this.drawOverlay(); } },
        h('div', { class: 'card-h' }, h('span', { class: 'sev' }, f.sev), h('span', { class: 'rule' }, `${i + 1} · ${f.rule} ${f.name}`)),
        h('div', { class: 'title' }, f.title),
        f.advice ? h('div', { class: 'advice' }, '建议：' + f.advice) : null,
        f.assume ? h('div', { class: 'assume' }, '依据：' + f.assume) : null)));
      return box;
    },
    renderAssume() {
      const s = this.sum, box = $('assume');
      const def = s.defaults.length ? `使用默认值：${s.defaults.map((d) => DEF[d] || d).join('、')}。默认值只能给出方向，请在项目 JSON 的 verify 块里填写实际数值。` : '所有输入都来自项目 JSON 的 verify 块。';
      const st = s.stackup;
      box.textContent = `${s.stage === 'P' ? '布线前估计：路径按引脚朝向与可走通道的概率估计，结论只用于判断方向。' : '布线后简化模型：铜皮来自实际布板数据，网格 ' + fmt(s.grid.cell, 2) + ' mm。'} 叠层 ${s.layers} 层，平面 ${st.planes.map((q) => `L${q.layer + 1}=${q.net}`).join('，') || '无'}。${def}`;
    },
    hover(x, y, px, py) {
      const tip = $('tip');
      if (x == null || !this.hoverFields || !this.hoverFields.length) { tip.hidden = true; return; }
      const parts = [];
      for (const f of this.hoverFields) {
        if (f.clip) { const fr = px / this.viewer.W; if (fr < f.clip[0] || fr > f.clip[1]) continue; }
        const g = f.g, i = Math.floor((x - g.x0) / g.cell), j = Math.floor((y - g.y0) / g.cell);
        if (i < 0 || j < 0 || i >= g.nx || j >= g.ny) continue;
        const v = f.f[j * g.nx + i];
        if (!Number.isFinite(v) || (f.unit === 'A/mm²' && !(v > 0))) continue;
        parts.push(`${f.label} ${f.unit === 'A/mm²' ? sci(v) : fmt(v, f.d)} ${f.unit}`);
      }
      const it = this.sum.items.find((q) => x >= q.rect.x0 && x <= q.rect.x1 && y >= q.rect.y0 && y <= q.rect.y1);
      if (it) parts.unshift(it.ref);
      if (!parts.length) { tip.hidden = true; return; }
      tip.textContent = parts.join(' · ');
      tip.hidden = false;
      tip.style.left = px + 14 + 'px'; tip.style.top = py + 12 + 'px';
    },

    // ---------- 导出 ----------
    async exportReport() {
      const r = await this.run('report', [{}], '正在逐项计算报告…');
      if (!r) return;
      download(`${(this.sum.name || 'layout').replace(/[\\/:*?"<>|]/g, '_')}-verify-report.json`, JSON.stringify(r, null, 2), 'application/json');
      const c = r.findings.reduce((m, f) => ((m[f.sev] = (m[f.sev] || 0) + 1), m), {});
      this.toast(`报告已导出：${['P0', 'P1', 'P2', 'P3'].filter((k) => c[k]).map((k) => `${k} ${c[k]} 条`).join('，') || '没有结论'}`);
    },
    exportPNG() {
      const v = this.viewer, out = document.createElement('canvas');
      out.width = v.base.width; out.height = v.base.height;
      const c = out.getContext('2d');
      c.fillStyle = '#0b0c10'; c.fillRect(0, 0, out.width, out.height);
      for (const cv of [v.base, v.fx, v.top]) c.drawImage(cv, 0, 0);
      out.toBlob((b) => download(`${this.tab}.png`, b, 'image/png'));
    },

    async loadCopperImage() {
      const img = await this.run('copperLayer', ['all', this.opt.layer], '正在载入铜皮…');
      if (!img) return;
      this.viewer.setCopper(PR.rasterize({ field: img.cov, grid: img.grid, pal: 'fire', min: 0, max: 4, alpha: 1, zeroClear: true }));
    },
  };

  const EK = { antenna: '天线', rf_trace: '射频走线', switch_node: '开关节点', inductor: '功率电感', clock: '时钟', hv_pulse: '高压脉冲' };
  const GRADE = { high: '高', mid: '中', low: '低' };
  const DEF = { sources: '电源起点', loads: '负载电流', thermal: '功耗', emitters: '干扰源', victims: '敏感对象', stackup: '叠层', env: '环境' };
  const fhz = (f) => (f >= 1e9 ? `${(f / 1e9).toFixed(2)} GHz` : f >= 1e6 ? `${(f / 1e6).toFixed(1)} MHz` : `${(f / 1e3).toFixed(0)} kHz`);
  const sci = (v) => (v >= 100 ? v.toFixed(0) : v >= 1 ? v.toFixed(1) : v.toExponential(1));
  function chk(label, val, on) { const i = h('input', { type: 'checkbox', checked: val ? true : null, onchange: (e) => on(e.target.checked) }); return h('label', { class: 'chk' }, i, label); }
  function sel(label, opts, val, on) { return h('label', { class: 'field' }, h('span', {}, label), h('select', { onchange: (e) => on(e.target.value) }, opts.map(([v, l]) => h('option', { value: v, selected: v === val ? true : null }, l)))); }
  function num(label, val, on) { return h('label', { class: 'field' }, h('span', {}, label), h('input', { type: 'number', value: val, step: 1, onchange: (e) => { const v = parseFloat(e.target.value); if (Number.isFinite(v)) on(v); } })); }
  function seg(opts, val, on) { return h('div', { class: 'seg', role: 'tablist' }, opts.map(([v, l]) => h('button', { 'aria-selected': String(v === val), onclick: () => on(v) }, l))); }
  function kv(rows) { return h('dl', { class: 'kv' }, rows.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])); }
  function legendBox(pal, label, id, range) {
    const cv = h('canvas', { class: 'legend-bar' });
    PR.legend(cv, pal);
    return h('div', { class: 'legend' }, h('div', { class: 'legend-label' }, label), cv, h('div', { class: 'legend-range', id: id + '-range' }, range || ''));
  }
  function download(name, data, type) {
    const blob = data instanceof Blob ? data : new Blob([data], { type });
    const a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /** 受扰地图动效：从干扰源向外扩散的环，亮度按衰减变暗；环扫过敏感对象时按受扰等级闪一下。 */
  class EmiAnim {
    constructor(v, ems, victims, on) { this.v = v; this.ems = ems; this.vic = victims; this.on = on; this.t = 0; this.reset(); if (on) this.loop(); else this.drawStatic(); }
    reset() { const c = this.v.fx.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, this.v.fx.width, this.v.fx.height); if (!this.on) this.drawStatic(); }
    setEnabled(on) { this.on = on; this.stop(); if (on) this.loop(); else this.drawStatic(); }
    stop() { cancelAnimationFrame(this.raf); this.raf = 0; }
    loop() {
      let last = performance.now();
      const tick = (t) => { const dt = Math.min(0.05, (t - last) / 1000); last = t; this.t += dt; this.draw(); if (this.on && !document.hidden) this.raf = requestAnimationFrame(tick); else this.raf = 0; };
      this.raf = requestAnimationFrame(tick);
    }
    draw() {
      const v = this.v, c = v.fx.getContext('2d'), s = v.view.s, size = Math.max(v.board.w, v.board.h);
      c.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
      c.clearRect(0, 0, v.W, v.H);
      c.save(); v.boardPath(c); c.clip();
      const period = 2.4, maxR = size * 0.9;
      for (const e of this.ems) {
        const amp = Math.pow(10, e.level / 20);
        const centers = e.pts.length > 6 ? e.pts.filter((_, i) => i % Math.ceil(e.pts.length / 6) === 0) : e.pts;
        for (let k = 0; k < 3; k++) {
          const ph = (((this.t / period + k / 3) % 1) + 1) % 1, r = Math.max(0, ph * maxR);
          const a = amp * (1 / (1 + (r / 3) ** 2)) * 0.9 * (1 - ph);
          if (a < 0.01) continue;
          c.strokeStyle = `rgba(255,140,220,${Math.min(0.8, a)})`;
          c.lineWidth = 1.5;
          for (const q of centers) { c.beginPath(); c.arc(v.sx(q[0]), v.sy(q[1]), r * s, 0, Math.PI * 2); c.stroke(); }
        }
        c.fillStyle = 'rgba(255,190,240,0.9)';
        for (const q of e.pts) { c.beginPath(); c.arc(v.sx(q[0]), v.sy(q[1]), 2, 0, Math.PI * 2); c.fill(); }
      }
      c.restore();
      for (const vi of this.vic) {
        const pulse = 0.5 + 0.5 * Math.sin(this.t * (vi.grade === 'high' ? 8 : vi.grade === 'mid' ? 4 : 1.5));
        const col = vi.grade === 'high' ? [255, 90, 90] : vi.grade === 'mid' ? [255, 200, 90] : [140, 220, 160];
        c.strokeStyle = `rgba(${col},${0.35 + 0.6 * pulse * (vi.grade === 'low' ? 0.3 : 1)})`;
        c.lineWidth = 2;
        c.beginPath(); c.arc(v.sx(vi.x), v.sy(vi.y), 7 + 4 * pulse, 0, Math.PI * 2); c.stroke();
      }
    }
    drawStatic() { this.t = 0.8; this.draw(); }
  }

  /** 平面谐振动效：模态幅度按正弦随时间反相。 */
  class ModeAnim {
    constructor(v, phi, g, on) { this.v = v; this.phi = phi; this.g = g; this.on = on; this.t = 0; if (on) this.loop(); }
    setEnabled(on) { this.on = on; this.stop(); if (on) this.loop(); else { this.v.updateHeat(0, { ...this.v.heats[0].h, scale: 1 }); } }
    stop() { cancelAnimationFrame(this.raf); this.raf = 0; }
    reset() {}
    loop() {
      let last = performance.now();
      const tick = (t) => {
        this.t += Math.min(0.05, (t - last) / 1000); last = t;
        if (this.v.heats && this.v.heats[0]) this.v.updateHeat(0, { ...this.v.heats[0].h, scale: Math.sin(this.t * 2.2) });
        if (this.on && !document.hidden) this.raf = requestAnimationFrame(tick); else this.raf = 0;
      };
      this.raf = requestAnimationFrame(tick);
    }
  }

  LP.App = App;
