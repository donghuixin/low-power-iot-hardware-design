<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布局布线验证器</title>
<style>
:root {
  --bg: #0b0c10; --panel: #13151b; --panel-2: #191c24; --line: #262a35; --text: #e6e8ee; --muted: #8c93a3;
  --accent: #ffd166; --p0: #ff4d4f; --p1: #ff9f43; --p2: #ffd166; --p3: #8ecae6; --ok: #7ee787;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 13px; }
button, select, input { font: inherit; color: inherit; }
#top { height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 14px; border-bottom: 1px solid var(--line); background: #0e0f14; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
.brand #proj-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { width: 18px; height: 18px; border-radius: 5px; background: conic-gradient(from 200deg, #ffb347, #ff5f6d, #7f7fd5, #86e3ce, #ffb347); flex: none; }
.badge { padding: 2px 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); white-space: nowrap; }
.badge.p { color: #ffd9a0; border-color: #6b5320; background: #2a2110; }
.badge.r { color: #b9f6ca; border-color: #1f6b3a; background: #0f2418; }
#tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
#tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; color: var(--muted); }
#tabs button[aria-selected="true"] { background: #262b38; color: var(--text); }
.actions { display: flex; gap: 6px; flex: 1 1 auto; justify-content: flex-end; }
.tbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.tbtn:hover { border-color: #3a4152; }
.tbtn.on, .tbtn[aria-pressed="true"] { border-color: #6b5320; color: #ffd9a0; }
.tbtn.primary { background: #2b2412; border-color: #6b5320; color: #ffe3a1; }
#layout { display: grid; grid-template-columns: 260px 1fr 330px; height: calc(100% - 52px); }
#left, #right { overflow: auto; padding: 12px 14px 24px; background: var(--panel); }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); }
#stage { position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #12141b 0%, #08090c 75%); }
#stage-canvas { position: absolute; inset: 0 0 34px 0; }
#stage-canvas canvas { position: absolute; inset: 0; }
.cv-top { cursor: grab; touch-action: none; }
.assume-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; margin: 0; padding: 8px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: #0d0e13; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h3 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 16px 0 8px; }
h3:first-child { margin-top: 2px; }
h4 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); }
.muted { color: var(--muted); font-size: 12px; line-height: 1.5; }
.list { display: flex; flex-direction: column; gap: 4px; }
.item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 8px; text-align: left; padding: 7px 9px; border-radius: 8px; border: 1px solid transparent; background: var(--panel-2); cursor: pointer; }
.item.static { cursor: default; }
.item b { font-weight: 600; }
.item span { color: var(--muted); font-size: 12px; }
.item em { font-style: normal; font-size: 11px; color: #c9a86a; }
.item em.warn { color: var(--p1); }
.item .mini { grid-column: 1 / -1; background: #0f1116; border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; font-size: 12px; }
.item.sel { border-color: #6b5320; background: #221d12; }
.item:not(.static):hover { border-color: #3a4152; }
.grade { justify-self: end; padding: 0 6px; border-radius: 99px; font-size: 11px; }
.grade.high { background: #3a1414; color: #ff9a9a; } .grade.mid { background: #3a2c10; color: #ffd27a; } .grade.low { background: #12301d; color: #9be9b0; }
.chk { display: flex; gap: 8px; align-items: center; padding: 4px 0; cursor: pointer; }
.field { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.field span { color: var(--muted); font-size: 12px; }
.field select, .field input { background: #0f1116; border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; }
.seg { display: flex; background: #0f1116; border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 5px 0; border-radius: 6px; cursor: pointer; color: var(--muted); }
.seg button[aria-selected="true"] { background: #262b38; color: var(--text); }
.legend { margin-top: 18px; }
.legend-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.legend-bar { width: 100%; height: 8px; border-radius: 4px; display: block; }
.legend-range { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; margin: 0; }
.kv dt { color: var(--muted); white-space: nowrap; }
.kv dd { margin: 0; line-height: 1.45; }
.findings { margin-top: 12px; }
.card { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 9px 10px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--p3); cursor: pointer; line-height: 1.45; }
.card.sev-P0 { border-left-color: var(--p0); } .card.sev-P1 { border-left-color: var(--p1); } .card.sev-P2 { border-left-color: var(--p2); }
.card.err { border-left-color: var(--p0); cursor: default; }
.card-h { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 11px; color: var(--muted); }
.sev { font-weight: 700; padding: 0 5px; border-radius: 4px; background: #2a2f3c; color: var(--text); }
.sev-P0 .sev { background: #4a1416; } .sev-P1 .sev { background: #4a2a10; } .sev-P2 .sev { background: #3d3412; }
.card .title { font-weight: 500; }
.card .advice { margin-top: 4px; color: #cfd5e2; font-size: 12px; }
.card .assume { margin-top: 3px; color: var(--muted); font-size: 11px; }
.ok { color: var(--ok); }
#tip { position: absolute; pointer-events: none; background: rgba(12,13,18,.92); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-size: 12px; white-space: nowrap; z-index: 5; }
#busy { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: rgba(12,13,18,.9); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; z-index: 6; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #555; border-top-color: var(--accent); animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
#toasts { position: absolute; right: 14px; bottom: 46px; display: flex; flex-direction: column; gap: 6px; z-index: 7; }
.toast { background: rgba(20,22,30,.95); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; max-width: 360px; }
#drop-hint { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; background: rgba(10,10,14,.7); font-size: 18px; z-index: 20; pointer-events: none; }
body.drop #drop-hint { display: flex; }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
@media (max-width: 1000px) {
  #layout { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; height: auto; }
  #left, #right { border: 0; border-top: 1px solid var(--line); }
  #stage { min-height: 60vh; }
  #top { height: auto; flex-wrap: wrap; padding: 8px 12px; }
  .actions { flex-wrap: wrap; }
}

/* 3D 展示 */
.view-seg { flex: 0 0 auto; }
.view-seg button { padding: 5px 14px; font-weight: 600; }
.view-seg button[aria-selected="true"] { background: #3a2f12; color: #ffe3a1; }
#three-host { position: absolute; inset: 0 0 34px 0; }
#three-host canvas { position: absolute; inset: 0; display: block; cursor: grab; }
#three-host canvas:active { cursor: grabbing; }
.l3d-host { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.l3d { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; color: #e8ecf4; text-shadow: 0 1px 3px #000, 0 0 6px #000; will-change: transform; }
.l3d.ref { color: #aab3c5; font-size: 11px; }
.l3d.layer { color: #9fd3ff; font-size: 13px; font-weight: 600; }
.l3d.layer.warm { color: #ffc58a; }
.l3d.mark.green { color: #7ee787; } .l3d.mark.yellow { color: #ffd166; } .l3d.mark.pink { color: #ffb3ea; }
.l3d.mark.high { color: #ff7a7a; } .l3d.mark.mid { color: #ffd27a; } .l3d.mark.low { color: #9ee3b0; }
.l3d.big { font-size: 26px; font-weight: 300; color: #fff; }
.l3d.small { font-size: 12px; color: #d7dbe6; }
.l3d.side { font-size: 14px; font-weight: 700; color: #fff; background: rgba(10,12,16,.55); padding: 2px 8px; border-radius: 6px; }

</style>
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span id="proj-name">布局布线验证器</span><span id="stage-badge" class="badge">—</span><span id="calc-mode" class="muted"></span></div>
  <nav id="tabs" role="tablist" aria-label="验证类别">
    <button data-tab="current" role="tab" aria-selected="true">电流与回流</button>
    <button data-tab="emi" role="tab" aria-selected="false">电磁</button>
    <button data-tab="thermal" role="tab" aria-selected="false">温度</button>
  </nav>
  <div class="seg view-seg" id="view-seg" role="tablist" aria-label="视图">
    <button data-view="2d" role="tab" aria-selected="true" title="2D 俯视（T 切换）">2D</button>
    <button data-view="3d" role="tab" aria-selected="false" title="3D 展示（T 切换）：左键拖动旋转、右键平移、滚轮缩放、双击复位">3D</button>
  </div>
  <div class="actions">
    <button id="btn-anim" class="tbtn" aria-pressed="true" title="开关动效">动效</button>
    <button id="btn-perf" class="tbtn" title="减少粒子数，适合较慢的电脑">性能模式</button>
    <button id="btn-open" class="tbtn" title="打开布局 JSON 或铜皮数据包（也可以直接拖进页面）">打开</button>
    <button id="btn-png" class="tbtn" title="导出当前视图">导出 PNG</button>
    <button id="btn-report" class="tbtn primary" title="逐项计算并导出 verify-report.json，交回 Claude 写进评审报告">导出报告</button>
    <input id="file-in" type="file" accept=".json,application/json" multiple hidden>
  </div>
</header>
<main id="layout">
  <aside id="left" aria-label="对象与假如"></aside>
  <section id="stage" aria-label="板图">
    <div id="stage-canvas"></div>
    <div id="three-host" hidden></div>
    <div id="tip" role="status" hidden></div>
    <div id="busy" hidden><span class="spin" aria-hidden="true"></span><span id="busy-text">计算中…</span></div>
    <div id="toasts" aria-live="polite"></div>
    <p id="assume" class="assume-bar"></p>
  </section>
  <aside id="right" aria-label="结论"></aside>
</main>
<div id="drop-hint">松开以载入布局 JSON 或铜皮数据包</div>

    const width = horizontal ? body.h : body.w;
    // Imported 2D footprints have an envelope and no measured thickness. A role's default IC height is unsuitable.
    const visualHeight = kind === 'resistor' ? Math.min(width * 0.48, 0.65) : width * 0.75;
    const height = isPos(nativeBody?.z) ? nativeBody.z : (!spec && !footprint && item.z) || visualHeight;

      for (const sign of [-1, 1]) {
        const offset = sign * (length - end) / 2;
        const index = sign < 0 ? 0 : 1;
        terminals.push({n: orderedPads[index]?.n ?? index + 1, x: body.x + (horizontal ? offset : 0), y: body.y + (horizontal ? 0 : offset),

    return {kind, body, pads, terminals, height};
  }

  function faceRect(item, pl = item.placed) {
    const pkg = passiveGeometry(item);
    if (!pkg) return footprint(item, pl);
    const {body} = pkg, center = toWorld(body.x, body.y, pl);
    const [w,h] = dims(body.w, body.h, pl.rot || 0);
    return G.rectFromCenter(center.x, center.y, w, h);
  }

  /** A mounted BGA exposes the package index on top; its solder balls face the board. */
  function bgaMark(item) {
    const footprint = typeof item.footprint === 'string' ? item.footprint.split(':').pop() : '';
    if (item.shape !== 'bga' && !/^[A-Z]*BGA(?=[\d_\s-]|$)/i.test(footprint)) return null;
    const a1 = item.physicalPads?.find(p => p.n === 'A1')?.xy?.[0];
    const corner = /[-_](TL|TR|BL|BR)$/i.exec(footprint)?.[1].toUpperCase();
    const sx = isNum(a1?.[0]) && a1[0] !== 0 ? Math.sign(a1[0]) : corner?.endsWith('R') ? 1 : -1;
    const sy = isNum(a1?.[1]) && a1[1] !== 0 ? Math.sign(a1[1]) : corner?.startsWith('B') ? -1 : 1;
    const r = Math.min(0.28, Math.min(item.w, item.h) * 0.08);

  }

  // ---------- 坐标变换 ----------
  function dims(w, h, rot) { return rot === 90 || rot === 270 ? [h, w] : [w, h]; }
  function footprint(part, pl) {
    pl = pl || part.placed;
    if (!pl) return null;
    const [w, h] = dims(part.w, part.h, pl.rot || 0);
    return G.rectFromCenter(pl.x, pl.y, w, h);
  }
  /** 局部坐标（器件中心为原点、未旋转、正面视角）→ 世界坐标。背面器件从正面看是镜像的。 */
  function toWorld(lx, ly, pl) {
    if (pl.side === 'bottom') lx = -lx;
    const a = ((pl.rot || 0) * Math.PI) / 180;
    const c = Math.round(Math.cos(a)), s = Math.round(Math.sin(a));
    return { x: pl.x + lx * c - ly * s, y: pl.y + lx * s + ly * c };
  }
  function dirToWorld(nx, ny, pl) {
    if (pl.side === 'bottom') nx = -nx;
    const a = ((pl.rot || 0) * Math.PI) / 180;
    const c = Math.round(Math.cos(a)), s = Math.round(Math.sin(a));

  const SIDE_NORMAL = { N: [0, 1], S: [0, -1], E: [1, 0], W: [-1, 0], C: [0, 0] };
  function pinLocal(part, pin) {

      case 'N': return { x: -w / 2 + t * w, y: h / 2 };
      case 'S': return { x: -w / 2 + t * w, y: -h / 2 };
      case 'E': return { x: w / 2, y: h / 2 - t * h };

  /** 引脚组的世界坐标与朝外法向。 */

    if (!pin || !pl) return null;
    const l = pinLocal(part, pin);
    const p = toWorld(l.x, l.y, pl);
    const [nx, ny] = SIDE_NORMAL[pin.side];
    const n = dirToWorld(nx, ny, pl);
    return { x: p.x, y: p.y, nx: n.x, ny: n.y, count: pin.count, side: pin.side };
  }
  /** 局部的边（N/E/S/W）在世界坐标中朝向哪一边。 */
  function worldSide(localSide, pl) {

    const n = dirToWorld(nx, ny, pl);

    if (n.x < -0.5) return 'W';
    if (n.y > 0.5) return 'N';

  function satFootprint(sat, pl) {
    pl = pl || sat.placed;
    if (!pl) return null;

  // ---------- 查询 ----------
  function partByRef(p, ref) { return p.parts.find((x) => x.ref === ref) || null; }
  function satByRef(p, ref) { return p.satellites.find((x) => x.ref === ref) || null; }
  function itemByRef(p, ref) { return partByRef(p, ref) || satByRef(p, ref); }
  function isChipPeripheral(item) {

      /^[RC](?:\d{4}|_\d{4}_\d{4}Metric)$/i.test((item.footprint || '').split(':').pop());

  function partTags(pt) {

    if (pt.role === 'dcdc') t.add('switching');
    if (pt.role === 'inductor') { t.add('inductor'); t.add('switching'); }
    if (['inductor', 'battery', 'motor_driver'].includes(pt.role)) t.add('magnetic_source');

  function satTags(s) {

  }
  /** 器件之间是否有网络相连。返回 Map<ref, Set<netClass>>。 */
  function connectedParts(p, ref) {
    const out = new Map();
    for (const n of p.nets) {
      if (!n.pins.some((q) => q[0] === ref)) continue;
      for (const q of n.pins) {
        if (q[0] === ref) continue;
        if (!out.has(q[0])) out.set(q[0], new Set());
        out.get(q[0]).add(n.class);
      }

    return out;
  }
  /** 解析电容值文本（如 "100nF"、"4.7uF"）为法拉，解析失败返回 Infinity。 */
  function parseCap(v) {

    const m = v.trim().match(/^([\d.]+)\s*([pnuµm]?)F?/i);
    if (!m) return Infinity;
    const mul = { p: 1e-12, n: 1e-9, u: 1e-6, 'µ': 1e-6, m: 1e-3, '': 1 }[m[2].toLowerCase()] ?? 1;

  // ---------- 板框形状 ----------
  /** 可选的板框形状。rect/stadium/circle 用解析形状；chamfer/lshape/custom 存为多边形，并记下 shape 与参数以便再次编辑。 */
  const BOARD_SHAPES = ['rect', 'stadium', 'chamfer', 'lshape', 'circle', 'custom'];
  /** 由形状和参数生成板框。参数：w、h、r（圆角）、c（倒角）、nw/nh（L 形右上角缺口）、d（直径）、points（自定义）。 */
  function outlineFromShape(shape, q) {
    const w = q.w, h = q.h;
    switch (shape) {
      case 'circle': return { type: 'circle', d: q.d };
      case 'stadium': return { type: 'rect', w, h, corner_r: Math.min(w, h) / 2, shape: 'stadium' };
      case 'chamfer': {
        const c = Math.max(0.5, Math.min(q.c ?? 3, w / 2 - 0.5, h / 2 - 0.5));
        return { type: 'polygon', shape: 'chamfer', w, h, c, points: [[c, 0], [w - c, 0], [w, c], [w, h - c], [w - c, h], [c, h], [0, h - c], [0, c]] };
      }
      case 'lshape': {
        const nw = Math.max(1, Math.min(q.nw ?? w * 0.4, w - 2)), nh = Math.max(1, Math.min(q.nh ?? h * 0.4, h - 2));
        return { type: 'polygon', shape: 'lshape', w, h, nw, nh, points: [[0, 0], [w, 0], [w, h - nh], [w - nw, h - nh], [w - nw, h], [0, h]] };
      }
      case 'custom': return { type: 'polygon', shape: 'custom', points: q.points.map((pt) => [r2(pt[0]), r2(pt[1])]) };
      case 'rect': default: return { type: 'rect', w, h, corner_r: Math.max(0, q.r ?? 0) };
    }
  }
  /** 当前板框属于哪种形状（供界面回显）。 */
  function shapeOf(o) {
    if (o.type === 'circle') return 'circle';
    if (o.type === 'rect') return o.shape === 'stadium' ? 'stadium' : 'rect';
    return ['chamfer', 'lshape'].includes(o.shape) ? o.shape : 'custom';
  }
  /** 转为可逐点编辑的多边形：只保留形状的特征顶点（圆角忽略，圆形取 16 边形）。 */
  function toEditablePolygon(o) {
    if (o.type === 'polygon') return { type: 'polygon', shape: 'custom', points: o.points.map((pt) => [...pt]) };
    if (o.type === 'circle') {
      const r = o.d / 2;
      return { type: 'polygon', shape: 'custom', points: Array.from({ length: 16 }, (_, i) => { const a = (i / 16) * Math.PI * 2; return [r2(r + r * Math.cos(a)), r2(r + r * Math.sin(a))]; }) };
    }
    return { type: 'polygon', shape: 'custom', points: [[0, 0], [o.w, 0], [o.w, o.h], [0, o.h]] };
  }
  /** 板框 DXF（R12，毫米）：外框为 BOARD 层线段，固定孔为 HOLES 层圆。可导入嘉立创 EDA 作为初始板框。 */
  function exportDXF(p) {
    const out = ['0', 'SECTION', '2', 'HEADER', '9', '$INSUNITS', '70', '4', '0', 'ENDSEC', '0', 'SECTION', '2', 'ENTITIES'];
    const f = (v) => (Math.round(v * 1000) / 1000).toFixed(3);
    const o = p.board.outline;
    if (o.type === 'circle') out.push('0', 'CIRCLE', '8', 'BOARD', '10', f(o.d / 2), '20', f(o.d / 2), '30', '0', '40', f(o.d / 2));
    else {
      const pts = G.outlinePolygon(o);
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        out.push('0', 'LINE', '8', 'BOARD', '10', f(a.x), '20', f(a.y), '30', '0', '11', f(b.x), '21', f(b.y), '31', '0');
      }
    }
    for (const h of p.board.holes || []) out.push('0', 'CIRCLE', '8', 'HOLES', '10', f(h.x), '20', f(h.y), '30', '0', '40', f(h.d / 2));
    out.push('0', 'ENDSEC', '0', 'EOF');
    return out.join('\r\n') + '\r\n';
  }

  // ---------- 改板框时同步固定孔与禁布区 ----------
  /**
   * 板框尺寸改变后，固定孔和禁布区保持到最近板角（按外包矩形）或板边（圆形之间）的相对位置，
   * 避免缩小板子后它们落到板外。
   */
  function remapBoardFeatures(board, oldO, newO) {
    const ob = G.outlineBBox(oldO), nb = G.outlineBBox(newO);
    const mapPoint = (x, y) => {
      if (oldO.type === 'circle' && newO.type === 'circle') {
        const oc = G.center(ob), nc = G.center(nb), r0 = oldO.d / 2, r1 = newO.d / 2;
        const dx = x - oc.x, dy = y - oc.y, d = Math.hypot(dx, dy) || 1;
        const inset = r0 - d;
        const nd = Math.max(0, r1 - inset);
        return { x: nc.x + (dx / d) * nd, y: nc.y + (dy / d) * nd };
      }
      const fx = (x - ob.x0) / Math.max(ob.x1 - ob.x0, 1e-9), fy = (y - ob.y0) / Math.max(ob.y1 - ob.y0, 1e-9);
      const nx = fx < 0.5 ? nb.x0 + (x - ob.x0) : nb.x1 - (ob.x1 - x);
      const ny = fy < 0.5 ? nb.y0 + (y - ob.y0) : nb.y1 - (ob.y1 - y);
      return { x: nx, y: ny };
    };
    for (const h of board.holes || []) { const q = mapPoint(h.x, h.y); h.x = r2(q.x); h.y = r2(q.y); }
    for (const k of board.keepouts || []) {
      const c = mapPoint(k.x + k.w / 2, k.y + k.h / 2);
      // 贴边的禁布区保持贴边
      const q = mapPoint(k.x, k.y);
      const fx = (k.x + k.w / 2 - ob.x0) / Math.max(ob.x1 - ob.x0, 1e-9), fy = (k.y + k.h / 2 - ob.y0) / Math.max(ob.y1 - ob.y0, 1e-9);
      k.x = r2(fx < 0.5 ? q.x : c.x - k.w / 2);
      k.y = r2(fy < 0.5 ? q.y : c.y - k.h / 2);
    }
  }
  /** 主器件占地面积（mm²），分正反面；用于提示板子是否够大。 */
  function partsArea(p) {
    let top = 0, bottom = 0, maxDim = 0;
    for (const x of p.parts) {
      const a = x.w * x.h;
      if (x.sides.includes('top')) top += a; else bottom += a;
      maxDim = Math.max(maxDim, Math.min(x.w, x.h));
    }
    for (const s of p.satellites) top += s.w * s.h;
    return { top, bottom, maxDim };
  }

  // ---------- 撤销快照与持久化 ----------
  function snapshot(p) {
    const parts = {}, sats = {};
    for (const x of p.parts) parts[x.ref] = x.placed ? { ...x.placed } : null;
    for (const x of p.satellites) sats[x.ref] = x.pinned && x.placed ? { ...x.placed } : null;
    return JSON.stringify({ board: p.board, parts, sats, locked: p.parts.filter((x) => x.locked).map((x) => x.ref) });
  }
  function restore(p, snap) {
    const s = JSON.parse(snap);

    const locked = new Set(s.locked || []);
    for (const x of p.parts) { x.placed = s.parts[x.ref] ? { ...s.parts[x.ref] } : null; x.locked = locked.has(x.ref); }
    for (const x of p.satellites) {
      const v = s.sats[x.ref];

    }

  function stableStringify(v) {
    if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
    if (v && typeof v === 'object') return '{' + Object.keys(v).filter((k) => k[0] !== '_').sort().map((k) => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';

  }
  /** 项目定义（不含摆放结果）的指纹，用于判断本地自动保存的状态是否属于同一个项目。 */
  function definitionHash(p) {

    for (const x of d.satellites || []) { delete x.placed; delete x.pinned; delete x.visualPackage; }
    if (d.board) { delete d.board.outline; delete d.board.mask; delete d.board.holes; }
    const s = stableStringify(d);

    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(16);
  }

  // ---------- 导出 ----------
  const r2 = (v) => Math.round(v * 100) / 100;

    for (const x of out.satellites) if (x.placed) x.placed = { x: r2(x.placed.x), y: r2(x.placed.y), rot: x.placed.rot, side: x.placed.side };
    if (ev) out.result = resultObject(ev);

  }
  function resultObject(ev) {

      metrics: {

  function exportCSV(p) {

  }


  // ---------- 固定孔 ----------
  /** 常用固定孔：孔径取螺丝的常用过孔尺寸。 */
  const HOLE_SIZES = [{ id: 'M2', d: 2.2 }, { id: 'M2.5', d: 2.7 }, { id: 'M3', d: 3.2 }];
  const HOLE_EDGE = 1.5;   // 孔边到板边的推荐最小距离（留出焊环和铣边公差）
  const holeRectOf = (x, y, d) => G.rectFromCenter(x, y, d, d);
  /** 孔放在 (x, y) 是否合适：在板内且离边足够、不与其它孔、禁布区、已摆放器件冲突。ignore 为要跳过的孔序号。 */
  function holeFits(p, x, y, d, ignore) {
    const b = p.board, r = holeRectOf(x, y, d);
    if (!G.rectInBoard(b.outline, G.expand(r, HOLE_EDGE))) return false;
    for (let i = 0; i < (b.holes || []).length; i++) {
      if (i === ignore) continue;
      const h = b.holes[i];
      if (Math.hypot(h.x - x, h.y - y) < (h.d + d) / 2 + 2) return false;
    }
    for (const k of b.keepouts || []) if (G.overlaps(r, { x0: k.x, y0: k.y, x1: k.x + k.w, y1: k.y + k.h })) return false;
    const rr = G.expand(r, 0.8);
    for (const x2 of p.parts) if (x2.placed && G.overlaps(rr, footprint(x2))) return false;
    for (const s of p.satellites) if (s.placed && s._active && G.overlaps(rr, satFootprint(s))) return false;

// 分析入口：Worker 与 Node 测试都通过这里调用。保存当前项目状态，按"输入 + 参数"缓存结果。

        this.sum = await this.client.call('init', project, copper || null);
      } catch (err) { this.setBusy(false); this.fatal('读入失败：' + err.message); return; }
      this.setBusy(false);
      this.project = project; this.copper = copper || null;
      const s = this.sum;
      this.opt.ta = s.env.ta_c;
      this.sel.load = s.loads.length ? s.loads.reduce((b, l, i) => (l.i_avg_ma > s.loads[b].i_avg_ma ? i : b), 0) : -1;
      this.sel.heatRef = s.thermal.length ? s.thermal.reduce((b, t) => (t.p_w > b.p_w ? t : b), s.thermal[0]).part : null;
      $('proj-name').textContent = s.name || '未命名项目';
      const badge = $('stage-badge');
      badge.textContent = s.stage === 'R' ? '布线后 · 简化模型' : '布线前 · 估计';
      badge.className = 'badge ' + (s.stage === 'R' ? 'r' : 'p');
      $('calc-mode').textContent = this.client.mode === 'worker' ? '' : '（主线程计算）';
      this.viewer.setBoard(s);
      if (this.v3) this.v3.setBoard(s);
      if (s.stage === 'R') await this.loadCopperImage();
      this.renderTab();
    },

    // ---------- 外框 ----------
    bindChrome() {
      document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => { this.tab = b.dataset.tab; this.renderTab(); }));
      const anim = $('btn-anim');
      const syncAnim = () => { anim.setAttribute('aria-pressed', String(this.parts.enabled)); anim.classList.toggle('on', this.parts.enabled); };
      syncAnim();
      anim.addEventListener('click', () => { this.parts.setEnabled(!this.parts.enabled); store.set('anim', this.parts.enabled ? '1' : '0'); syncAnim(); if (this.emiAnim) this.emiAnim.setEnabled(this.parts.enabled); if (this.modeAnim) this.modeAnim.setEnabled(this.parts.enabled); if (this.v3) { this.v3.setAnim(this.parts.enabled); if (this.view === '3d') this.renderTab(); } });
      $('btn-perf').addEventListener('click', () => { const on = this.parts.level < 2; this.parts.level = on ? 2 : 0; $('btn-perf').classList.toggle('on', on); this.parts.reset(); this.toast(on ? '性能模式：粒子减到四分之一、不画拖尾' : '已恢复默认动效'); });
      $('btn-report').addEventListener('click', () => this.exportReport());
      document.querySelectorAll('#view-seg button').forEach((b) => b.addEventListener('click', () => this.setView(b.dataset.view)));
      addEventListener('keydown', (e) => { if ((e.key === 't' || e.key === 'T') && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) this.setView(this.view === '3d' ? '2d' : '3d'); });
      $('btn-png').addEventListener('click', () => this.exportPNG());
      $('btn-open').addEventListener('click', () => $('file-in').click());
      $('file-in').addEventListener('change', (e) => this.openFiles(e.target.files));
      document.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drop'); });
      document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('drop'); });
      document.addEventListener('drop', (e) => { e.preventDefault(); document.body.classList.remove('drop'); this.openFiles(e.dataTransfer.files); });
    },
    async openFiles(files) {
      let project = null, copper = null;
      for (const f of files || []) {
        try {
          const j = JSON.parse(await f.text());
          if (j.kind === 'copper-pack') copper = j; else if (j.board && j.parts) project = j;
        } catch (e) { this.toast(`${f.name} 不是有效的 JSON`); }
      }
      if (!project && !copper) return;
      if (copper && !project) { project = this.project; this.toast('已载入铜皮数据包，切换到布线后验证'); }
      await this.load(project, copper || (project === this.project ? this.copper : null));
    },
    setBusy(on, text) {
      this.busy += on ? 1 : -1;
      if (this.busy < 0) this.busy = 0;
      $('busy').hidden = !this.busy;
      if (text) $('busy-text').textContent = text;
    },
    toast(msg) {
      if (!msg) return;
      const t = h('div', { class: 'toast' }, msg);
      $('toasts').append(t);
      setTimeout(() => t.remove(), 3500);
    },
    fatal(msg) { put($('right'), h('div', { class: 'card err' }, msg)); },

    // ---------- 页签 ----------
    renderTab() {
      document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === this.tab)));
      this.stopAnims();
      if (this.v3 && this.view === '3d') this.v3.clearDyn();
      this.viewer.highlight = new Set();
      this.viewer.setHeats([]);
      this.viewer.setOverlay({});
      if (this.tab === 'current') this.showCurrent();
      else if (this.tab === 'emi') this.showEmi();
      else this.showThermal();
      this.renderAssume();
    },
    /** 3D 视图打开时：停掉 2D 动效，把同一份结果交给 3D 展示。 */
    sync3d(fn, d) {
      if (this.view !== '3d' || !this.v3) return;
      this.parts.stop();
      if (this.emiAnim) this.emiAnim.stop();
      if (this.modeAnim) this.modeAnim.stop();
      $('tip').hidden = true;
      this.v3[fn](d);
    },
    async setView(v) {
      if (v === this.view) return;
      if (v === '3d') {
        if (!LP.View3D.supported()) { this.toast('这个浏览器不支持 WebGL，无法打开 3D 视图'); return; }
        if (!this.v3) {
          this.setBusy(true, '正在载入 3D…');
          try { this.v3 = await LP.View3D.create($('three-host')); this.v3.setBoard(this.sum); }
          catch (err) { this.toast('3D 视图载入失败：' + err.message); return; }
          finally { this.setBusy(false); }
        }
        this.v3.setAnim(this.parts.enabled);
      }
      this.view = v;
      document.querySelectorAll('#view-seg button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === v)));
      $('stage-canvas').style.visibility = v === '3d' ? 'hidden' : '';
      if (this.v3) this.v3.setActive(v === '3d');
      this.renderTab();
    },
    stopAnims() {
      this.parts.stop();
      if (this.emiAnim) { this.emiAnim.stop(); this.emiAnim = null; }
      if (this.modeAnim) { this.modeAnim.stop(); this.modeAnim = null; }
      this.hoverFields = [];
    },
    async run(op, args, label) {
      const tk = ++this.token;
      this.setBusy(true, label);
      try {
        const r = await this.client.call(op, ...args);
        return tk === this.token ? r : null;
      } catch (err) { this.toast('计算出错：' + err.message.split('\n')[0]); return null; }
      finally { this.setBusy(false); }
    },

    // ---------- 电流 ----------
    stackupFor() {
      const s = this.sum.stackup, L = this.sum.layers;
      if (this.opt.stack === '2l') return { ...s, planes: [], h_mm: 1.6 };
      if (this.opt.stack === '4l') { const pwr = (this.sum.sources[0] || {}).net; return { ...s, planes: [{ layer: 1, net: this.sum.gnd }, ...(pwr ? [{ layer: 2, net: pwr }] : [])], cu_oz: s.cu_oz.length >= 4 ? s.cu_oz : [1, 0.5, 0.5, 1], h_mm: 0.2 }; }
      return null;
    },
    async showCurrent() {
      const s = this.sum;
      const left = $('left');
      put(left, 
        h('h3', {}, '选择负载'),
        h('p', { class: 'muted' }, '每次只看一个器件：它的电流从电源起点来，回流从它的地脚回到起点的地。'),
        h('div', { class: 'list' }, s.loads.map((l) => h('button', { class: 'item' + (l.i === this.sel.load ? ' sel' : ''), onclick: () => { this.sel.load = l.i; this.showCurrent(); } },
          h('b', {}, l.part), h('span', {}, `${l.net} · ${fmt(l.i_avg_ma, l.i_avg_ma < 1 ? 2 : 1)} mA · ${KIND[l.kind] || l.kind}`), l.def ? h('em', {}, '默认值') : null))),
        !s.loads.length ? h('p', { class: 'muted' }, '项目里没有可选的负载：请在 verify.loads 中填写，或给电源网络标上 class: "power"。') : null,
        h('h3', {}, '显示'),
        chk('去程（暖色）', this.opt.sup, (v) => { this.opt.sup = v; this.drawCurrent(); }),
        chk('回流（冷色）', this.opt.ret, (v) => { this.opt.ret = v; this.drawCurrent(); }),
        s.stage === 'P' ? h('div', {}, h('h3', {}, '假如'),
          sel('叠层', [['project', `按项目（${s.layers} 层）`], ['2l', '2 层，没有整层地'], ['4l', '4 层，整层地 + 电源层']], this.opt.stack, (v) => { this.opt.stack = v; this.showCurrent(); })) : null,
        legendBox('fire', '|J| A/mm²（对数）', 'cur-legend'),
      );
      if (this.sel.load < 0) return;
      const st = this.stackupFor();
      const r = await this.run('current', [this.sel.load, st ? { stackup: st } : {}], '正在估算电流路径…');

    },
    drawCurrent() {
      const r = this.res.current;
      if (!r || r.error) return;
      const g = this.sum.grid;
      let hi = 0;
      for (const f of [r.sup, r.ret]) for (let c = 0; c < f.mag.length; c++) if (f.mag[c] > hi) hi = f.mag[c];
      const lo = hi / 1e3;
      const heats = [];
      if (this.opt.sup) heats.push({ field: r.sup.mag, grid: g, pal: 'fire', min: lo, max: hi, log: true, fade: true, zeroClear: true, alpha: 0.85, blend: 'lighter' });
      if (this.opt.ret) heats.push({ field: r.ret.mag, grid: g, pal: 'ice', min: lo, max: hi, log: true, fade: true, zeroClear: true, alpha: 0.55, blend: 'lighter' });
      this.viewer.setHeats(heats);
      this.hoverFields = [{ f: r.sup.mag, g, label: '去程', unit: 'A/mm²', d: 3 }, { f: r.ret.mag, g, label: '回流', unit: 'A/mm²', d: 3 }];
      const sys = [];
      if (this.opt.sup) sys.push({ fx: r.sup.fx, fy: r.sup.fy, mag: r.sup.mag, grid: g, pal: 'fire', share: this.opt.ret ? 0.6 : 1, jitter: r.jitter, lo, hi });
      if (this.opt.ret) sys.push({ fx: r.ret.fx, fy: r.ret.fy, mag: r.ret.mag, grid: g, pal: 'ice', share: this.opt.sup ? 0.4 : 1, lo, hi, speed: 0.8, alpha: 0.7 });
      this.parts.set(sys); this.parts.start();
      const l = this.sum.loads[this.sel.load];
      this.viewer.highlight = new Set([l.part, r.pins && this.sum.sources.find((x) => x.net === l.net) ? this.sum.sources.find((x) => x.net === l.net).part : null, ...(r.decaps || []).map((d) => d.ref)].filter(Boolean));
      const lg = $('cur-legend-range');
      if (lg) lg.textContent = `${fmt(lo, 3)} – ${fmt(hi, 1)}`;
      this.drawOverlay();
      this.sync3d('showCurrent', { r, g, lo, hi, sup: this.opt.sup, ret: this.opt.ret });
    },
    renderCurrentRight(r) {
      const l = this.sum.loads[this.sel.load];
      const rows = [
        ['电流', `平均 ${fmt(l.i_avg_ma, 2)} mA，峰值 ${fmt(l.i_peak_ma, 1)} mA（${KIND[l.kind] || l.kind}）`],

        r.spread != null ? ['路径不确定度', `约 ±${fmt(r.spread, 1)} mm（候选路径的离散程度）`] : null,
      ].filter(Boolean);
      put($('right'), 
        h('h3', {}, `${l.part} 的供电与回流`),
        kv(rows),
        r.decaps && r.decaps.length ? h('div', {}, h('h4', {}, '旁边的电容'), kv(r.decaps.map((d) => [d.ref, `离引脚 ${d.d} mm，回路约 ${d.area} mm²`]))) : null,

    async showEmiMap() {

      this.emiAnim = new EmiAnim(this.viewer, r.emitters.filter((e) => this.sel.emiOnly == null || e.id === this.sel.emiOnly), r.victims, this.parts.enabled);
      this.drawOverlay();
      this.sync3d('showEmiMap', { map, g, emitters: r.emitters.filter((e) => this.sel.emiOnly == null || e.id === this.sel.emiOnly), victims: r.victims });
      put($('right'), 
        h('h3', {}, '受扰情况'),
        h('p', { class: 'muted' }, '每个敏感对象取它所在位置的受扰等级，列出贡献最大的两个干扰源。'),
        kv(r.victims.map((v) => [v.label, `${GRADE[v.grade]}（${fmt(v.level, 0)} dB）· ${v.top.map((t) => `${t.label} ${fmt(t.db, 0)}`).join('，')}`])),
        this.findingsBox(r.findings),

    async showModes() {

      const k = Math.min(this.sel.mode, r.modes.length - 1);

          h('b', {}, `第 ${i + 1} 模`), h('span', {}, fhz(m.f)), m.near.length ? h('em', { class: 'warn' }, '接近工作频率') : null))),

      this.overlayExtra = { nodal, callout: { x: g.x0 + ((mc % g.nx) + 0.5) * g.cell, y: g.y0 + (((mc / g.nx) | 0) + 0.5) * g.cell, big: fhz(m.f), small: `第 ${k + 1} 模 · 起伏已放大${m.near.length ? ' · 接近 ' + m.near[0] : ''}` } };

      put($('right'),

    // ---------- 温度 ----------
    thermalOpts(withMeasures) {
      const o = { env: { ta_c: this.opt.ta } };
      if (!withMeasures) return o;
      o.heatsinks = { ...this.opt.heatsinks };
      o.env.airflow_m_s = this.opt.airflow;
      if (this.opt.sealed) o.env.sealed_k_per_w = 10;
      if (this.opt.fullCopper) o.copper = [{ rect: { x0: -1e3, y0: -1e3, x1: 1e3, y1: 1e3 }, cov: 0.8 }];
      return o;
    },
    async showThermal() {
      const s = this.sum;
      const hsOpts = [['0', '无'], ['0.05', '小（约 20 K/W）'], ['0.1', '中（约 10 K/W）'], ['0.25', '大（约 4 K/W）']];
      put($('left'), 
        h('h3', {}, '发热器件'),
        h('div', { class: 'list' }, s.thermal.map((t) => h('div', { class: 'item' + (t.part === this.sel.heatRef ? ' sel' : ''), onclick: (e) => { if (e.target.tagName === 'SELECT') return; this.sel.heatRef = t.part; this.showThermal(); } },
          h('b', {}, t.part), h('span', {}, `${fmt(t.p_w * 1000, t.p_w < 0.1 ? 1 : 0)} mW`), t.def ? h('em', {}, '默认值') : null,
          h('select', { class: 'mini', title: '散热器', onchange: (e) => { const v = +e.target.value; if (v) this.opt.heatsinks[t.part] = v; else delete this.opt.heatsinks[t.part]; this.showThermal(); } },
            hsOpts.map(([v, l]) => h('option', { value: v, selected: String(this.opt.heatsinks[t.part] || 0) === v ? true : null }, '散热器：' + l)))))),
        h('h3', {}, '散热措施（右半边）'),
        sel('空气', [['0', '自然对流'], ['0.5', '微风 0.5 m/s'], ['1', '风扇 1 m/s'], ['2', '风扇 2 m/s']], String(this.opt.airflow), (v) => { this.opt.airflow = +v; this.showThermal(); }),
        chk('各信号层大面积铺铜', this.opt.fullCopper, (v) => { this.opt.fullCopper = v; this.showThermal(); }),
        h('h3', {}, '环境'),
        num('环境温度 °C', this.opt.ta, (v) => { this.opt.ta = v; this.showThermal(); }),
        chk('密闭外壳（壳内升温 10 K/W）', this.opt.sealed, (v) => { this.opt.sealed = v; this.showThermal(); }),
        h('h3', {}, '显示'),
        chk('左右对比：无散热 | 有散热', this.opt.compare, (v) => { this.opt.compare = v; this.showThermal(); }),
        legendBox('heat', '板温 °C', 'th-legend'),
      );
      const base = await this.run('thermal', [this.thermalOpts(false)], '正在求温度分布…');
      if (!base || this.tab !== 'thermal') return;
      const cfg = await this.run('thermal', [this.thermalOpts(true)], '正在求加散热后的温度…');
      if (!cfg || this.tab !== 'thermal') return;
      this.res.thermal = { base, cfg };
      this.drawThermal();
    },
    drawThermal() {
      const { base, cfg } = this.res.thermal, g = this.sum.grid;
      const lo = base.ta, hi = Math.max(base.tmax, cfg.tmax, lo + 5);
      const cmp = this.opt.compare, sp = this.opt.split;
      const heats = cmp
        ? [{ field: base.T, grid: g, pal: 'heat', min: lo, max: hi, alpha: 0.9, clip: [0, sp] }, { field: cfg.T, grid: g, pal: 'heat', min: lo, max: hi, alpha: 0.9, clip: [sp, 1] }]
        : [{ field: cfg.T, grid: g, pal: 'heat', min: lo, max: hi, alpha: 0.9 }];
      this.viewer.setHeats(heats);
      $('th-legend-range').textContent = `${fmt(lo, 1)} – ${fmt(hi, 1)}`;
      this.hoverFields = cmp ? [{ f: base.T, g, label: '无散热', unit: '°C', d: 1, clip: [0, sp] }, { f: cfg.T, g, label: '有散热', unit: '°C', d: 1, clip: [sp, 1] }] : [{ f: cfg.T, g, label: '板温', unit: '°C', d: 1 }];
      const levels = [];
      for (let k = 1; k <= 5; k++) levels.push(lo + ((hi - lo) * k) / 6);
      let contours = [];
      for (const L of levels) contours = contours.concat(PR.contour(cfg.T, g, L));
      const vx = (x) => this.viewer.sx(x) / this.viewer.W;
      const half = (res, left) => {
        const sp2 = new Float32Array(res.flux.length);
        for (let c = 0; c < sp2.length; c++) { const x = g.x0 + ((c % g.nx) + 0.5) * g.cell, f = vx(x); sp2[c] = !cmp || (left ? f < sp : f >= sp) ? res.flux[c] : 0; }
        return sp2;
      };
      let fh = 0; for (const r of [base, cfg]) for (let c = 0; c < r.flux.length; c++) fh = Math.max(fh, r.flux[c]);
      const sys = cmp
        ? [{ fx: base.fx, fy: base.fy, mag: base.flux, spawn: half(base, true), grid: g, pal: 'fire', share: 0.35, lo: fh * 1e-3, hi: fh, speed: 0.4, alpha: 0.4 },
          { fx: cfg.fx, fy: cfg.fy, mag: cfg.flux, spawn: half(cfg, false), grid: g, pal: 'fire', share: 0.35, lo: fh * 1e-3, hi: fh, speed: 0.4, alpha: 0.4 }]
        : [{ fx: cfg.fx, fy: cfg.fy, mag: cfg.flux, grid: g, pal: 'fire', share: 0.7, lo: fh * 1e-3, hi: fh, speed: 0.4, alpha: 0.4 }];
      this.parts.set(sys); this.parts.start();
      const ref = this.sel.heatRef;
      const pb = base.parts.find((q) => q.ref === ref), pc = cfg.parts.find((q) => q.ref === ref);
      const it = this.sum.items.find((x) => x.ref === ref);
      const measures = [this.opt.heatsinks[ref] ? '加散热器' : null, this.opt.airflow ? `风速 ${this.opt.airflow} m/s` : null, this.opt.fullCopper ? '大面积铺铜' : null].filter(Boolean);
      this.overlayExtra = { contours, split: cmp ? sp : null, splitLabels: ['无散热', '有散热'],
        callout: pb && pc && it ? { x: (it.rect.x0 + it.rect.x1) / 2, y: (it.rect.y0 + it.rect.y1) / 2, big: cmp ? `${fmt(pb.tj, 0)} °C → ${fmt(pc.tj, 0)} °C` : `${fmt(pc.tj, 0)} °C`, small: `${ref} 结温 · 同样功耗${measures.length ? ' · ' + measures.join('、') : ''}` } : null };
      this.viewer.highlight = new Set(ref ? [ref] : []);
      this.drawOverlay();
      this.sync3d('showThermal', { base, cfg, g, lo, hi, compare: cmp, split: sp, heatsinks: { ...this.opt.heatsinks }, callout: this.overlayExtra.callout });
      put($('right'), 
        h('h3', {}, '温度'),
        kv([['环境', `${fmt(base.ta, 1)} °C`], ['总功耗', `${fmt(base.P * 1000, 0)} mW`], ['板面最高', `无散热 ${fmt(base.tmax, 1)} °C · 有散热 ${fmt(cfg.tmax, 1)} °C`], ['能量核对', `散出 ${fmt(cfg.loss * 1000, 1)} mW / 输入 ${fmt(cfg.P * 1000, 1)} mW`]]),
        h('h4', {}, '器件结温（无散热 → 有散热）'),
        kv(base.parts.map((q) => { const c = cfg.parts.find((x) => x.ref === q.ref); return [q.ref, `${fmt(q.tj, 1)} → ${fmt(c ? c.tj : null, 1)} °C（板 ${fmt(c ? c.tb : q.tb, 1)} °C，上限 ${q.tjmax} °C）`]; })),
        this.findingsBox(cfg.findings),
      );
    },
    applyThermalClip() {
      if (!this.res.thermal || !this.opt.compare) return;
      if (this.viewer.heats.length === 2) { this.viewer.heats[0].h.clip = [0, this.opt.split]; this.viewer.heats[1].h.clip = [this.opt.split, 1]; this.viewer.drawBase(); }
      if (this.overlayExtra) this.overlayExtra.split = this.opt.split;
      this.drawOverlay();
    },

    // ---------- 标注、提示、结论 ----------
    drawOverlay() {
      const o = { ...(this.overlayExtra || {}) };
      if (this.tab === 'current' && this.res.current && !this.res.current.error) {
        const r = this.res.current, p = r.pins;
        o.marks = [{ x: p.src.x, y: p.src.y, color: '#7ee787', label: '电源起点' }, { x: p.load.x, y: p.load.y, color: '#ffd166', label: '负载' }];
        if (this.opt.ret) o.marks.push({ x: p.loadGnd.x, y: p.loadGnd.y, color: '#79c0ff', r: 4, label: '地' }, { x: p.srcGnd.x, y: p.srcGnd.y, color: '#79c0ff', r: 4 });
        o.lines = [];
        if (this.opt.sup && r.supPts) o.lines.push({ pts: r.supPts, color: 'rgba(255,190,120,0.45)' });
        if (this.opt.ret && r.retPts && r.retMode !== 'image') o.lines.push({ pts: r.retPts, color: 'rgba(120,200,255,0.45)' });
        o.findings = r.findings || [];
      }
      if (this.tab === 'emi' && this.sel.emiSub === 'map' && this.res.emi) o.findings = this.res.emi.findings;
      if (this.tab === 'emi' && this.sel.emiSub === 'modes' && this.res.modes) o.findings = this.res.modes.findings || [];
      if (this.tab === 'thermal' && this.res.thermal) o.findings = this.res.thermal.cfg.findings;
      if (this.focus != null && o.findings && o.findings[this.focus]) o.findings = o.findings.map((f, i) => (i === this.focus ? { ...f, focus: true } : f));
      if (this.tab !== 'thermal' && !(this.tab === 'emi' && this.sel.emiSub === 'modes')) this.overlayExtra = null;
      this.viewer.setOverlay(o);
    },
    findingsBox(list) {
      this.focus = null;
      const box = h('div', { class: 'findings' }, h('h4', {}, list.length ? `结论（${list.length}）` : '结论'));
      if (!list.length) box.append(h('p', { class: 'ok' }, '这一项没有发现问题。'));
      list.forEach((f, i) => box.append(h('button', { class: 'card sev-' + f.sev, onclick: () => { this.focus = i; this.drawOverlay(); } },
        h('div', { class: 'card-h' }, h('span', { class: 'sev' }, f.sev), h('span', { class: 'rule' }, `${i + 1} · ${f.rule} ${f.name}`)),
        h('div', { class: 'title' }, f.title),
        f.advice ? h('div', { class: 'advice' }, '建议：' + f.advice) : null,
        f.assume ? h('div', { class: 'assume' }, '依据：' + f.assume) : null)));
      return box;
    },
    renderAssume() {
      const s = this.sum, box = $('assume');
      const def = s.defaults.length ? `使用默认值：${s.defaults.map((d) => DEF[d] || d).join('、')}。默认值只能给出方向，请在项目 JSON 的 verify 块里填写实际数值。` : '所有输入都来自项目 JSON 的 verify 块。';
      const st = s.stackup;
      box.textContent = `${s.stage === 'P' ? '布线前估计：路径按引脚朝向与可走通道的概率估计，结论只用于判断方向。' : '布线后简化模型：铜皮来自实际布板数据，网格 ' + fmt(s.grid.cell, 2) + ' mm。'} 叠层 ${s.layers} 层，平面 ${st.planes.map((q) => `L${q.layer + 1}=${q.net}`).join('，') || '无'}。${def}`;
    },
    hover(x, y, px, py) {
      const tip = $('tip');
      if (x == null || !this.hoverFields || !this.hoverFields.length) { tip.hidden = true; return; }
      const parts = [];
      for (const f of this.hoverFields) {
        if (f.clip) { const fr = px / this.viewer.W; if (fr < f.clip[0] || fr > f.clip[1]) continue; }
        const g = f.g, i = Math.floor((x - g.x0) / g.cell), j = Math.floor((y - g.y0) / g.cell);
        if (i < 0 || j < 0 || i >= g.nx || j >= g.ny) continue;
        const v = f.f[j * g.nx + i];
        if (!Number.isFinite(v) || (f.unit === 'A/mm²' && !(v > 0))) continue;
        parts.push(`${f.label} ${f.unit === 'A/mm²' ? sci(v) : fmt(v, f.d)} ${f.unit}`);
      }
      const it = this.sum.items.find((q) => x >= q.rect.x0 && x <= q.rect.x1 && y >= q.rect.y0 && y <= q.rect.y1);
      if (it) parts.unshift(it.ref);
      if (!parts.length) { tip.hidden = true; return; }
      tip.textContent = parts.join(' · ');
      tip.hidden = false;
      tip.style.left = px + 14 + 'px'; tip.style.top = py + 12 + 'px';
    },

    // ---------- 导出 ----------
    async exportReport() {
      const r = await this.run('report', [{}], '正在逐项计算报告…');
      if (!r) return;
      download(`${(this.sum.name || 'layout').replace(/[\\/:*?"<>|]/g, '_')}-verify-report.json`, JSON.stringify(r, null, 2), 'application/json');
      const c = r.findings.reduce((m, f) => ((m[f.sev] = (m[f.sev] || 0) + 1), m), {});
      this.toast(`报告已导出：${['P0', 'P1', 'P2', 'P3'].filter((k) => c[k]).map((k) => `${k} ${c[k]} 条`).join('，') || '没有结论'}`);
    },
    exportPNG() {
      if (this.view === '3d' && this.v3) { this.v3.snapshot((b) => download(`${this.tab}-3d.png`, b, 'image/png')); return; }
      const v = this.viewer, out = document.createElement('canvas');
      out.width = v.base.width; out.height = v.base.height;
      const c = out.getContext('2d');
      c.fillStyle = '#0b0c10'; c.fillRect(0, 0, out.width, out.height);
      for (const cv of [v.base, v.fx, v.top]) c.drawImage(cv, 0, 0);
      out.toBlob((b) => download(`${this.tab}.png`, b, 'image/png'));
    },

    async loadCopperImage() {
      const img = await this.run('copperLayer', ['all', this.opt.layer], '正在载入铜皮…');
      if (!img) return;
      this.viewer.setCopper(PR.rasterize({ field: img.cov, grid: img.grid, pal: 'fire', min: 0, max: 4, alpha: 1, zeroClear: true }));
    },
  };

  const EK = { antenna: '天线', rf_trace: '射频走线', switch_node: '开关节点', inductor: '功率电感', clock: '时钟', hv_pulse: '高压脉冲' };
  const GRADE = { high: '高', mid: '中', low: '低' };
  const DEF = { sources: '电源起点', loads: '负载电流', thermal: '功耗', emitters: '干扰源', victims: '敏感对象', stackup: '叠层', env: '环境' };
  const fhz = (f) => (f >= 1e9 ? `${(f / 1e9).toFixed(2)} GHz` : f >= 1e6 ? `${(f / 1e6).toFixed(1)} MHz` : `${(f / 1e3).toFixed(0)} kHz`);
  const sci = (v) => (v >= 100 ? v.toFixed(0) : v >= 1 ? v.toFixed(1) : v.toExponential(1));
  function chk(label, val, on) { const i = h('input', { type: 'checkbox', checked: val ? true : null, onchange: (e) => on(e.target.checked) }); return h('label', { class: 'chk' }, i, label); }
  function sel(label, opts, val, on) { return h('label', { class: 'field' }, h('span', {}, label), h('select', { onchange: (e) => on(e.target.value) }, opts.map(([v, l]) => h('option', { value: v, selected: v === val ? true : null }, l)))); }
  function num(label, val, on) { return h('label', { class: 'field' }, h('span', {}, label), h('input', { type: 'number', value: val, step: 1, onchange: (e) => { const v = parseFloat(e.target.value); if (Number.isFinite(v)) on(v); } })); }
  function seg(opts, val, on) { return h('div', { class: 'seg', role: 'tablist' }, opts.map(([v, l]) => h('button', { 'aria-selected': String(v === val), onclick: () => on(v) }, l))); }
  function kv(rows) { return h('dl', { class: 'kv' }, rows.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])); }
  function legendBox(pal, label, id, range) {
    const cv = h('canvas', { class: 'legend-bar' });
    PR.legend(cv, pal);
    return h('div', { class: 'legend' }, h('div', { class: 'legend-label' }, label), cv, h('div', { class: 'legend-range', id: id + '-range' }, range || ''));
  }
  function download(name, data, type) {
    const blob = data instanceof Blob ? data : new Blob([data], { type });
    const a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /** 受扰地图动效：从干扰源向外扩散的环，亮度按衰减变暗；环扫过敏感对象时按受扰等级闪一下。 */
  class EmiAnim {
    constructor(v, ems, victims, on) { this.v = v; this.ems = ems; this.vic = victims; this.on = on; this.t = 0; this.reset(); if (on) this.loop(); else this.drawStatic(); }
    reset() { const c = this.v.fx.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, this.v.fx.width, this.v.fx.height); if (!this.on) this.drawStatic(); }
    setEnabled(on) { this.on = on; this.stop(); if (on) this.loop(); else this.drawStatic(); }
    stop() { cancelAnimationFrame(this.raf); this.raf = 0; }
    loop() {
      let last = performance.now();
      const tick = (t) => { const dt = Math.min(0.05, (t - last) / 1000); last = t; this.t += dt; this.draw(); if (this.on && !document.hidden) this.raf = requestAnimationFrame(tick); else this.raf = 0; };
      this.raf = requestAnimationFrame(tick);
    }
    draw() {
      const v = this.v, c = v.fx.getContext('2d'), s = v.view.s, size = Math.max(v.board.w, v.board.h);
      c.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
      c.clearRect(0, 0, v.W, v.H);
      c.save(); v.boardPath(c); c.clip();
      const period = 2.4, maxR = size * 0.9;
      for (const e of this.ems) {
        const amp = Math.pow(10, e.level / 20);
        const centers = e.pts.length > 6 ? e.pts.filter((_, i) => i % Math.ceil(e.pts.length / 6) === 0) : e.pts;
        for (let k = 0; k < 3; k++) {
          const ph = (((this.t / period + k / 3) % 1) + 1) % 1, r = Math.max(0, ph * maxR);
          const a = amp * (1 / (1 + (r / 3) ** 2)) * 0.9 * (1 - ph);
          if (a < 0.01) continue;
          c.strokeStyle = `rgba(255,140,220,${Math.min(0.8, a)})`;
          c.lineWidth = 1.5;
          for (const q of centers) { c.beginPath(); c.arc(v.sx(q[0]), v.sy(q[1]), r * s, 0, Math.PI * 2); c.stroke(); }
        }
        c.fillStyle = 'rgba(255,190,240,0.9)';
        for (const q of e.pts) { c.beginPath(); c.arc(v.sx(q[0]), v.sy(q[1]), 2, 0, Math.PI * 2); c.fill(); }
      }
      c.restore();
      for (const vi of this.vic) {
        const pulse = 0.5 + 0.5 * Math.sin(this.t * (vi.grade === 'high' ? 8 : vi.grade === 'mid' ? 4 : 1.5));
        const col = vi.grade === 'high' ? [255, 90, 90] : vi.grade === 'mid' ? [255, 200, 90] : [140, 220, 160];
        c.strokeStyle = `rgba(${col},${0.35 + 0.6 * pulse * (vi.grade === 'low' ? 0.3 : 1)})`;
        c.lineWidth = 2;
        c.beginPath(); c.arc(v.sx(vi.x), v.sy(vi.y), 7 + 4 * pulse, 0, Math.PI * 2); c.stroke();
      }
    }
    drawStatic() { this.t = 0.8; this.draw(); }
  }

  /** 平面谐振动效：模态幅度按正弦随时间反相。 */
  class ModeAnim {
    constructor(v, phi, g, on) { this.v = v; this.phi = phi; this.g = g; this.on = on; this.t = 0; if (on) this.loop(); }
    setEnabled(on) { this.on = on; this.stop(); if (on) this.loop(); else { this.v.updateHeat(0, { ...this.v.heats[0].h, scale: 1 }); } }
    stop() { cancelAnimationFrame(this.raf); this.raf = 0; }
    reset() {}
    loop() {
      let last = performance.now();
      const tick = (t) => {
        this.t += Math.min(0.05, (t - last) / 1000); last = t;
        if (this.v.heats && this.v.heats[0]) this.v.updateHeat(0, { ...this.v.heats[0].h, scale: Math.sin(this.t * 2.2) });
        if (this.on && !document.hidden) this.raf = requestAnimationFrame(tick); else this.raf = 0;
      };
      this.raf = requestAnimationFrame(tick);
    }
  }

  LP.App = App;
})(globalThis.LP = globalThis.LP || {});

</script>
<script>
/* ---- js/main.js ---- */
// 启动：读页面里嵌入的项目（make_layout_project.py --verifier 注入），没有就用示例；可选的铜皮数据包。
(function (LP) {
  'use strict';
  function readJSON(id) {
    const el = document.getElementById(id);
    const t = el && el.textContent.trim();
    if (!t) return null;
    try { return JSON.parse(t); } catch (e) { return null; }
  }
  window.addEventListener('DOMContentLoaded', async () => {
    const project = readJSON('project-data') || readJSON('example-data');
    const copper = readJSON('copper-data');
    if (!project) { document.getElementById('right').textContent = '页面里没有项目数据。用"打开"选择布局规划器导出的布局 JSON。'; return; }
    await LP.App.boot(project, copper);
    window.__LV_READY = true;
  });
})(globalThis.LP = globalThis.LP || {});

</script>
